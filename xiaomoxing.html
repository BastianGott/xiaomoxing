<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>小模型 · Tiny Model</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23ff5b4f'/%3E%3Ctext x='32' y='46' font-size='40' text-anchor='middle' fill='white' font-family='KaiTi,serif'%3E%E5%B0%8F%3C/text%3E%3C/svg%3E">
<style>
:root {
  --bg: #0e1015; --bg2: #13161d; --card: #191d27; --card2: #202533; --line: #2a3041; --line2: #363d52;
  --text: #e8eaf0; --muted: #8d95a8; --faint: #5d6579;
  --accent: #ff5b4f; --accent-ink: #fff; --jade: #34c9a1; --gold: #f2b84b; --good: #3ecf8e; --bad: #ff5f61; --blue: #5aa2ff;
  --t1: #ff6b6b; --t2: #ffad42; --t3: #46c98a; --t4: #5aa2ff; --t5: #9aa1b1;
  --shadow: 0 10px 30px rgba(0,0,0,.35);
  --r: 14px;
  --ui: "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, "Microsoft YaHei", sans-serif;
  --mono: "Cascadia Code", "JetBrains Mono", Consolas, ui-monospace, Menlo, monospace;
  --han-kai: "KaiTi", "STKaiti", "Kaiti SC", "AR PL UKai CN", "Noto Serif CJK SC", "Noto Serif SC", serif;
  --han-sans: "Microsoft YaHei", "PingFang SC", "Noto Sans CJK SC", "Noto Sans SC", sans-serif;
  --han-serif: "SimSun", "Songti SC", "Noto Serif CJK SC", "Noto Serif SC", serif;
  --han: var(--han-kai);
  color-scheme: dark;
}
:root[data-theme="light"] {
  --bg: #f5f1ea; --bg2: #efe9df; --card: #fffcf7; --card2: #f6f0e6; --line: #e3dacb; --line2: #d4c8b5;
  --text: #1f2128; --muted: #6b6f7b; --faint: #a19b90;
  --accent: #d93b2f; --jade: #11916f; --gold: #b7791f; --good: #13925f; --bad: #d63a3c; --blue: #2b6fd6;
  --t1: #d63434; --t2: #d27a00; --t3: #19924f; --t4: #2b6fd6; --t5: #8a8f99;
  --shadow: 0 10px 30px rgba(80,60,30,.12);
  color-scheme: light;
}
:root[data-font="sans"] { --han: var(--han-sans); }
:root[data-font="serif"] { --han: var(--han-serif); }

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.5 var(--ui); min-height: 100vh; -webkit-font-smoothing: antialiased; }
button { font: inherit; color: inherit; cursor: pointer; }
input, select { font: inherit; color: inherit; }
a { color: var(--blue); }
.han { font-family: var(--han); }
.mono { font-family: var(--mono); }
.muted { color: var(--muted); }
.faint { color: var(--faint); }
.t1 { color: var(--t1); } .t2 { color: var(--t2); } .t3 { color: var(--t3); } .t4 { color: var(--t4); } .t5 { color: var(--t5); }
.hidden { display: none !important; }
kbd { font: 11px var(--mono); border: 1px solid var(--line2); border-bottom-width: 2px; border-radius: 5px; padding: 1px 5px; color: var(--muted); background: var(--card2); }

/* ---------- top bar ---------- */
.topbar { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; gap: 18px; padding: 10px 22px;
  background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.logo { display: flex; align-items: baseline; gap: 8px; font-weight: 700; letter-spacing: .2px; cursor: pointer; user-select: none; }
.logo .zh { font-family: var(--han); font-size: 24px; color: var(--accent); }
.logo .en { font-size: 13px; color: var(--muted); font-weight: 600; }
.nav { display: flex; gap: 4px; margin-left: 8px; }
.nav button { background: none; border: 0; padding: 7px 12px; border-radius: 9px; color: var(--muted); font-weight: 600; font-size: 14px; }
.nav button:hover { color: var(--text); background: var(--card); }
.nav button.on { color: var(--text); background: var(--card2); }
.nav .zh { font-family: var(--han-sans); font-weight: 400; margin-left: 4px; color: var(--faint); font-size: 12px; }
.topstats { margin-left: auto; display: flex; gap: 14px; align-items: center; font-size: 13px; color: var(--muted); }
.topstats b { color: var(--text); font-family: var(--mono); font-weight: 600; }
.lvchip { display: flex; align-items: center; gap: 8px; }
.xpbar { width: 90px; height: 6px; border-radius: 4px; background: var(--card2); overflow: hidden; }
.xpbar i { display: block; height: 100%; background: linear-gradient(90deg, var(--accent), var(--gold)); border-radius: 4px; transition: width .5s; }

main { max-width: 1000px; margin: 0 auto; padding: 26px 22px 80px; }
h1, h2, h3 { margin: 0 0 10px; line-height: 1.2; }
h2 { font-size: 20px; }
h3 { font-size: 15px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .6px; }

/* ---------- generic ---------- */
.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.grid { display: grid; gap: 16px; }
.g2 { grid-template-columns: 1fr 1fr; }
.g3 { grid-template-columns: repeat(3, 1fr); }
.g4 { grid-template-columns: repeat(4, 1fr); }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--line2); background: var(--card2); padding: 9px 16px; border-radius: 10px; font-weight: 600; transition: transform .06s, background .15s, border-color .15s; }
.btn:hover { border-color: var(--muted); }
.btn:active { transform: translateY(1px); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.big { padding: 13px 26px; font-size: 17px; border-radius: 12px; }
.btn.ghost { background: transparent; }
.btn.small { padding: 5px 10px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .45; cursor: default; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 2px 10px; font-size: 12px; font-weight: 600; background: var(--card2); color: var(--muted); border: 1px solid var(--line); }
.pill.accent { color: var(--accent); border-color: color-mix(in srgb, var(--accent) 40%, transparent); }
.pill.jade { color: var(--jade); border-color: color-mix(in srgb, var(--jade) 40%, transparent); }
.pill.gold { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 40%, transparent); }
.stat { display: flex; flex-direction: column; gap: 2px; }
.stat .v { font: 600 26px/1.1 var(--mono); }
.stat .k { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
.stat .s { font-size: 12px; color: var(--faint); }
.bar { height: 8px; border-radius: 6px; background: var(--card2); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 6px; background: var(--jade); }

/* ---------- dashboard ---------- */
.hero { display: grid; grid-template-columns: 1.25fr 1fr; gap: 16px; margin-bottom: 16px; }
.epochcard { position: relative; overflow: hidden; padding: 26px 26px 22px; }
.epochcard .bigzh { position: absolute; right: -10px; bottom: -40px; font: 190px/1 var(--han); color: var(--accent); opacity: .07; pointer-events: none; }
.epochcard h1 { font-size: 30px; }
.epochcard .sub { color: var(--muted); margin-bottom: 18px; }
.duebox { display: flex; gap: 26px; margin: 8px 0 22px; }
.modelname { background: none; border: 0; border-bottom: 1px dashed var(--line2); padding: 0; font: inherit; color: inherit; width: 100%; outline: none; }
.modelname:focus { border-bottom-color: var(--accent); }
.arch { display: flex; flex-direction: column; gap: 6px; }
.arch .lane { display: flex; gap: 6px; flex-wrap: wrap; }
.arch .blk { flex: 1 1 auto; min-width: 74px; border-radius: 8px; padding: 6px 8px; font-size: 12px; font-weight: 600; text-align: center; border: 1px solid var(--line); background: var(--bg2); color: var(--faint); cursor: pointer; white-space: nowrap; }
.arch .blk.on { color: var(--text); background: color-mix(in srgb, var(--jade) 13%, var(--card)); border-color: color-mix(in srgb, var(--jade) 45%, transparent); }
.arch .blk { position: relative; }
.arch .blk.new::after { content: ''; position: absolute; top: 4px; right: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--gold); }
.arch .stack { border: 1px dashed var(--line2); border-radius: 10px; padding: 6px; position: relative; }
.arch .stack::after { content: attr(data-n); position: absolute; right: 8px; top: -9px; background: var(--card); padding: 0 6px; font: 11px var(--mono); color: var(--muted); }
.arch .lbl { font-size: 11px; color: var(--faint); text-transform: uppercase; letter-spacing: .6px; margin-top: 4px; }
.spark { width: 100%; height: 60px; }

/* ---------- session ---------- */
.sessbar { display: flex; align-items: center; gap: 14px; margin-bottom: 18px; font-size: 13px; color: var(--muted); }
.sessbar .prog { flex: 1; height: 8px; border-radius: 6px; background: var(--card2); overflow: hidden; }
.sessbar .prog i { display: block; height: 100%; background: linear-gradient(90deg, var(--jade), var(--blue)); transition: width .35s; }
.sessbar b { font-family: var(--mono); color: var(--text); font-weight: 600; }
.stage { min-height: 470px; display: flex; flex-direction: column; align-items: center; }
.qcard { width: 100%; max-width: 680px; padding: 28px 30px; text-align: center; position: relative; }
.mode { font: 600 11px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: 1px; display: flex; justify-content: center; gap: 8px; align-items: center; }
.mode .zh { font-family: var(--han-sans); letter-spacing: 0; }
.hz { font-family: var(--han); font-size: 88px; line-height: 1.15; margin: 14px 0 4px; letter-spacing: 4px; }
.hz.md { font-size: 64px; }
.py { font-size: 26px; font-weight: 500; margin-bottom: 4px; letter-spacing: .5px; }
.mean { font-size: 20px; margin: 6px 0; }
.prompt-en { font-size: 30px; font-weight: 600; margin: 26px 0 16px; }
.opts { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 22px; }
.opt { text-align: left; display: flex; gap: 12px; align-items: center; padding: 13px 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); min-height: 58px; }
.opt:hover { border-color: var(--muted); }
.opt .k { font: 600 12px var(--mono); color: var(--faint); border: 1px solid var(--line2); border-radius: 6px; padding: 1px 6px; }
.opt .hzo { font-family: var(--han); font-size: 30px; line-height: 1; }
.opt.right { border-color: var(--good); background: color-mix(in srgb, var(--good) 16%, var(--card2)); }
.opt.wrong { border-color: var(--bad); background: color-mix(in srgb, var(--bad) 16%, var(--card2)); }
.opt.dim { opacity: .45; }
.speak { border: 1px solid var(--line2); background: var(--card2); border-radius: 50%; width: 44px; height: 44px; display: inline-grid; place-items: center; vertical-align: middle; }
.speak:hover { border-color: var(--accent); color: var(--accent); }
.speak.huge { width: 96px; height: 96px; margin: 26px auto 10px; display: grid; }
.speak svg { width: 46%; height: 46%; }
.typein { width: 100%; max-width: 380px; text-align: center; font: 500 26px var(--mono); padding: 10px 14px; border-radius: 12px; border: 2px solid var(--line2); background: var(--bg2); outline: none; margin-top: 18px; }
.typein:focus { border-color: var(--blue); }
.typein.ok { border-color: var(--good); } .typein.bad { border-color: var(--bad); } .typein.meh { border-color: var(--gold); }
.verdict { font-weight: 700; margin-top: 12px; min-height: 22px; }
.verdict.ok { color: var(--good); } .verdict.bad { color: var(--bad); } .verdict.meh { color: var(--gold); }
.reveal { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
.memline { font: 12px var(--mono); color: var(--faint); margin-top: 10px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 20px; width: 100%; max-width: 680px; }
.grade { border-radius: 12px; padding: 10px 6px 8px; border: 1px solid var(--line2); background: var(--card2); display: flex; flex-direction: column; align-items: center; gap: 2px; }
.grade .gn { font-weight: 700; }
.grade .gi { font: 12px var(--mono); color: var(--muted); }
.grade .gk { font: 11px var(--mono); color: var(--faint); }
.grade.g1 .gn { color: var(--bad); } .grade.g2 .gn { color: var(--gold); } .grade.g3 .gn { color: var(--good); } .grade.g4 .gn { color: var(--blue); }
.grade.sug { box-shadow: 0 0 0 2px var(--good); }
.grade:disabled { opacity: .3; }
.hint { font-size: 12px; color: var(--faint); margin-top: 14px; display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
.newbadge { position: absolute; top: 14px; right: 16px; }
.lnk { background: none; border: 0; color: var(--muted); text-decoration: underline; font-size: 12px; padding: 0; }

/* sentences */
.sent { display: flex; flex-wrap: wrap; justify-content: center; gap: 2px 6px; margin: 6px 0; }
.tok { display: inline-flex; flex-direction: column; align-items: center; padding: 2px 3px; border-radius: 6px; }
.tok .tz { font-family: var(--han); font-size: 30px; line-height: 1.2; }
.tok .tp { font-size: 12px; color: var(--muted); }
.tok.hl { background: color-mix(in srgb, var(--gold) 18%, transparent); }
.tok.punct .tz { color: var(--muted); }
.exbox { background: var(--bg2); border-radius: 12px; padding: 10px 14px; margin-top: 14px; cursor: pointer; }
.exbox .en { color: var(--muted); font-size: 14px; }
.exbox.small .tz { font-size: 22px; }

/* ---------- sentence training ---------- */
.opts.one { grid-template-columns: 1fr; }
.typein.wide { max-width: 580px; font: 500 22px var(--ui); }
.typein.wide::placeholder { font-size: 15px; }
.typein.han-in { font-family: var(--ui), var(--han-sans); }
.zhsent { font-family: var(--han); font-size: 44px; line-height: 1.45; margin: 22px 0 6px; letter-spacing: 2px; }
.unkw { border-bottom: 3px dotted var(--gold); }
.pyhint { font-size: 18px; min-height: 28px; letter-spacing: .3px; }
.en-big { font-size: 18px; font-weight: 600; margin: 6px 0 0; }
.gloss { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; margin-top: 14px; }
.gl { display: flex; align-items: baseline; gap: 6px; border: 1px solid var(--line2); background: var(--bg2); border-radius: 9px; padding: 4px 9px; font-size: 13px; max-width: 100%; }
.gl:hover { border-color: var(--muted); }
.gl .hzo { font-family: var(--han); font-size: 20px; }
.gl .glp { font-size: 12px; }
.gl .glm { color: var(--muted); font-size: 12px; max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.gl.unk { border-color: var(--gold); }
.tok.dok .tz { color: var(--good); }
.tok.dbad { background: color-mix(in srgb, var(--bad) 16%, transparent); }
.tok.dbad .tz { color: var(--bad); }
.yours { background: var(--bg2); border-radius: 10px; padding: 8px 12px; margin-bottom: 8px; }
.gamebtn.on { border-color: var(--accent); box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 40%, transparent); }
.duebox .stat .s { font-size: 11px; }

/* ---------- idioms ---------- */
.idchars { display: flex; justify-content: center; gap: 10px; margin: 16px 0 6px; flex-wrap: wrap; }
.idc { display: flex; flex-direction: column; align-items: center; min-width: 74px; }
.idz { font-family: var(--han); font-size: 64px; line-height: 1.1; }
.idc.mask .idz { width: 72px; text-align: center; color: var(--gold); border: 2px dashed var(--gold); border-radius: 12px; font-family: var(--mono); font-size: 44px; line-height: 1.5; }
.idp { font-size: 16px; }
.idl { font-size: 12px; color: var(--faint); max-width: 90px; text-align: center; }
.idstory { font-size: 14px; color: var(--muted); background: var(--bg2); border-radius: 10px; padding: 8px 12px; margin: 8px auto 0; max-width: 560px; text-align: left; line-height: 1.55; }
.idstory.ai { border-left: 3px solid var(--blue); }
.idgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin-top: 12px; }
.idcard { display: flex; flex-direction: column; gap: 2px; text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 10px; padding: 8px 10px; opacity: .55; }
.idcard .han { font-size: 22px; }
.idcard.seen { opacity: 1; border-color: color-mix(in srgb, var(--gold) 45%, transparent); }
.idcard:hover { opacity: 1; }

/* ---------- mini-games ---------- */
.gamehead { width: 100%; max-width: 760px; display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
.gamehead .title { font-weight: 700; font-size: 18px; }
.gamehead .zh { font-family: var(--han-sans); color: var(--muted); }
.gamecard { width: 100%; max-width: 760px; }
.explain { font-size: 13px; color: var(--muted); background: var(--bg2); border-radius: 10px; padding: 9px 12px; margin-bottom: 14px; }
.explain b { color: var(--text); }
/* attention */
.attn { position: relative; display: grid; grid-template-columns: 1fr 1fr; gap: 80px; padding: 6px 4px; }
.attn svg { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.attn .col { display: flex; flex-direction: column; gap: 10px; z-index: 1; }
.attn .it { border: 1px solid var(--line2); background: var(--card2); border-radius: 12px; padding: 10px 14px; min-height: 54px; display: flex; align-items: center; gap: 10px; }
.attn .it .hzo { font-family: var(--han); font-size: 30px; }
.attn .it.sel { border-color: var(--blue); box-shadow: 0 0 0 2px color-mix(in srgb, var(--blue) 40%, transparent); }
.attn .it.done { opacity: .5; border-style: dashed; }
.attn .it.err { animation: shake .3s; border-color: var(--bad); }
.heat { display: grid; gap: 3px; margin: 10px auto 0; }
.heat div { width: 34px; height: 34px; border-radius: 6px; display: grid; place-items: center; font: 11px var(--mono); }
.heat .lab { background: none; font-family: var(--han); font-size: 18px; color: var(--muted); }
/* tokenizer */
.seg { display: flex; flex-wrap: wrap; justify-content: center; align-items: stretch; margin: 26px 0 10px; user-select: none; }
.seg .ch { font-family: var(--han); font-size: 46px; line-height: 1.2; padding: 4px 2px; }
.seg .gap { width: 18px; display: flex; justify-content: center; cursor: pointer; border-radius: 6px; position: relative; }
.seg .gap::after { content: ''; width: 2px; margin: 8px 0; background: var(--line); border-radius: 2px; transition: background .12s, width .12s; }
.seg .gap:hover::after { background: var(--muted); }
.seg .gap.on::after { width: 4px; background: var(--blue); }
.seg .gap.cur { background: color-mix(in srgb, var(--blue) 10%, transparent); }
.seg .gap.ok::after { width: 4px; background: var(--good); }
.seg .gap.miss::after { width: 4px; background: repeating-linear-gradient(var(--gold) 0 6px, transparent 6px 10px); }
.seg .gap.extra::after { width: 4px; background: var(--bad); }
.seg .gap.fixed { cursor: default; }
.seg .gap.fixed::after { background: transparent; }
/* quantize */
.qbits { display: flex; gap: 6px; justify-content: center; margin-bottom: 8px; }
.qbits span { font: 600 12px var(--mono); padding: 3px 9px; border-radius: 7px; border: 1px solid var(--line2); color: var(--faint); }
.qbits span.on { color: var(--accent-ink); background: var(--accent); border-color: var(--accent); }
.sylrow { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; margin-top: 18px; }
.sylbox { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.sylbox .base { font: 600 24px var(--mono); }
.tonebtns { display: flex; gap: 4px; }
.tonebtns button { width: 36px; height: 36px; border-radius: 8px; border: 1px solid var(--line2); background: var(--card2); font: 600 15px var(--mono); }
.tonebtns button.on { background: var(--blue); border-color: var(--blue); color: #fff; }
.tonebtns button.ok { background: var(--good); border-color: var(--good); color: #fff; }
.tonebtns button.bad { background: var(--bad); border-color: var(--bad); color: #fff; }
.contour { width: 100%; max-width: 520px; height: 130px; margin: 12px auto 0; display: block; }
/* decoder */
.decout { min-height: 70px; display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; align-items: center; padding: 10px; border: 1px dashed var(--line2); border-radius: 12px; margin: 14px 0; }
.decout .tokd { font-family: var(--han); font-size: 30px; padding: 2px 8px; border-radius: 8px; background: color-mix(in srgb, var(--good) 14%, transparent); }
.decout .cursor { width: 2px; height: 34px; background: var(--blue); animation: blink 1s steps(2) infinite; }
.tiles { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.tile { font-family: var(--han); font-size: 28px; padding: 8px 14px; border-radius: 12px; border: 1px solid var(--line2); background: var(--card2); position: relative; }
.tile .k { position: absolute; top: 2px; left: 5px; font: 10px var(--mono); color: var(--faint); }
.tile.used { visibility: hidden; }
.tile .tg { display: block; font: 11px var(--ui); color: var(--faint); margin-top: 2px; }
.tile.err { animation: shake .3s; border-color: var(--bad); }
.nll { font: 13px var(--mono); color: var(--muted); }

/* ---------- summary / modal / toast ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(5,7,12,.6); z-index: 50; display: grid; place-items: center; padding: 20px; animation: fade .15s; }
.modal { width: 100%; max-width: 640px; max-height: 88vh; overflow: auto; background: var(--card); border: 1px solid var(--line2); border-radius: 18px; padding: 24px 26px; box-shadow: var(--shadow); }
.modal h2 { display: flex; align-items: center; gap: 10px; }
.formula { font: 14px var(--mono); background: var(--bg2); border-radius: 10px; padding: 10px 14px; margin: 12px 0; overflow-x: auto; }
.terms { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
.term { border: 1px solid var(--line2); border-radius: 10px; padding: 6px 12px; display: flex; gap: 10px; align-items: center; cursor: pointer; }
.term .hzo { font-family: var(--han); font-size: 26px; }
.quiz .opt { min-height: 46px; }
.toasts { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%); z-index: 60; display: flex; flex-direction: column; gap: 8px; align-items: center; pointer-events: none; }
.toast { background: var(--card2); border: 1px solid var(--line2); border-radius: 12px; padding: 9px 16px; box-shadow: var(--shadow); font-size: 14px; animation: rise .25s; }
.toast.warn { border-color: var(--gold); }
.xpfloat { position: fixed; z-index: 70; font: 700 16px var(--mono); color: var(--gold); pointer-events: none; animation: floatup 1s forwards; }
.levelup .big { font: 700 54px/1 var(--mono); color: var(--gold); }

/* ---------- tables ---------- */
.dicttools { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; }
.dicttools input, .dicttools select, .set input[type=text], .set select { background: var(--card); border: 1px solid var(--line2); border-radius: 10px; padding: 8px 12px; }
.dicttools input { flex: 1; min-width: 220px; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .5px; padding: 8px 10px; border-bottom: 1px solid var(--line); position: sticky; top: 56px; background: var(--bg); }
td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr.rowc { cursor: pointer; }
tr.rowc:hover td { background: var(--card); }
td .hzo { font-family: var(--han); font-size: 24px; }
.st-new { color: var(--faint); } .st-due { color: var(--gold); } .st-ok { color: var(--jade); } .st-mature { color: var(--blue); } .st-susp { color: var(--faint); text-decoration: line-through; }

/* ---------- lab ---------- */
.notes { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 12px; }
.note { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px; display: flex; flex-direction: column; gap: 4px; min-height: 108px; }
.note:hover { border-color: var(--line2); }
.note .nt { font-weight: 700; }
.note .nz { font-family: var(--han); font-size: 22px; color: var(--accent); }
.note.locked { opacity: .5; cursor: default; }
.note .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); display: inline-block; }
.games { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 12px; margin-bottom: 26px; }
.gamebtn { text-align: left; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 14px; }
.gamebtn .gt { font-weight: 700; }
.gamebtn .gz { font-family: var(--han); color: var(--accent); font-size: 20px; }
.gamebtn:disabled { opacity: .45; }

/* ---------- settings ---------- */
.set { display: grid; grid-template-columns: 220px 1fr; gap: 14px 22px; align-items: center; }
.set label { font-weight: 600; }
.set .d { font-size: 12px; color: var(--muted); font-weight: 400; display: block; }
.set input[type=range] { width: 100%; accent-color: var(--accent); }
.seg-ctl { display: inline-flex; border: 1px solid var(--line2); border-radius: 10px; overflow: hidden; }
.seg-ctl button { border: 0; background: var(--card); padding: 7px 14px; font-weight: 600; font-size: 13px; color: var(--muted); }
.seg-ctl button.on { background: var(--card2); color: var(--text); box-shadow: inset 0 -2px 0 var(--accent); }
.tbars { display: flex; flex-direction: column; gap: 5px; margin-top: 8px; }
.tbars .r { display: grid; grid-template-columns: 110px 1fr 46px; gap: 8px; align-items: center; font-size: 12px; }
.tbars .b { height: 10px; border-radius: 5px; background: var(--card2); overflow: hidden; }
.tbars .b i { display: block; height: 100%; background: var(--blue); transition: width .2s; }

/* charts */
.chart { width: 100%; height: 170px; display: block; }
.chart text { font: 10px var(--mono); fill: var(--faint); }
.heatcal { display: grid; grid-auto-flow: column; grid-template-rows: repeat(7, 12px); gap: 3px; overflow-x: auto; padding-bottom: 4px; }
.heatcal i { width: 12px; height: 12px; border-radius: 3px; background: var(--card2); display: block; }

@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-6px); } 75% { transform: translateX(6px); } }
@keyframes blink { 50% { opacity: 0; } }
@keyframes fade { from { opacity: 0; } }
@keyframes rise { from { opacity: 0; transform: translateY(10px); } }
@keyframes floatup { from { opacity: 1; transform: translateY(0); } to { opacity: 0; transform: translateY(-40px); } }
@keyframes pop { 0% { transform: scale(.9); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
.pop { animation: pop .18s ease-out; }

@media (max-width: 760px) {
  .hero, .g2, .g3, .g4 { grid-template-columns: 1fr; }
  .nav .zh, .topstats .hide-sm { display: none; }
  .topbar { flex-wrap: wrap; gap: 8px; padding: 8px 14px; }
  main { padding: 18px 14px 60px; }
  .hz { font-size: 72px; }
  .opts { grid-template-columns: 1fr; }
  .set { grid-template-columns: 1fr; }
  .attn { gap: 24px; }
}

/* ---------- chat fine-tuning: dialogues, usage notes ---------- */
.pill.blue { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 40%, transparent); }
.pill.warn { color: var(--bad); border-color: color-mix(in srgb, var(--bad) 45%, transparent); }
.usage { max-width: 560px; margin: 12px auto 0; text-align: left; font-size: 14px; line-height: 1.6; color: var(--muted); background: var(--bg2); border-radius: 10px; padding: 9px 13px; border-left: 3px solid var(--blue); }
.usage .ut { margin-bottom: 4px; }
.usage.small { font-size: 13px; padding: 7px 11px; margin-top: 8px; }
.usage.k-vulgar { border-left-color: var(--bad); }
.usage.k-slang { border-left-color: var(--gold); }
.say { color: var(--text); cursor: pointer; border-bottom: 1px dotted var(--line2); font-size: 1.08em; }
.say:hover { color: var(--accent); }
.chat { display: flex; flex-direction: column; gap: 10px; max-width: 620px; margin: 18px auto 0; }
.bub { display: flex; gap: 8px; align-items: flex-start; max-width: 88%; }
.bub.a { align-self: flex-start; }
.bub.b { align-self: flex-end; flex-direction: row-reverse; }
.bub .who { flex: none; width: 26px; height: 26px; border-radius: 50%; display: grid; place-items: center; font: 600 11px var(--mono); background: var(--card2); border: 1px solid var(--line2); color: var(--muted); margin-top: 6px; }
.bub.b .who { color: var(--blue); border-color: color-mix(in srgb, var(--blue) 45%, transparent); }
.bub .bbody { background: var(--card2); border: 1px solid var(--line2); border-radius: 16px; padding: 8px 14px; text-align: left; }
.bub.a .bbody { border-top-left-radius: 4px; }
.bub.b .bbody { border-top-right-radius: 4px; background: color-mix(in srgb, var(--blue) 12%, var(--card2)); border-color: color-mix(in srgb, var(--blue) 30%, var(--line2)); text-align: right; }
.bub .btxt { font-size: 34px; line-height: 1.35; letter-spacing: 1px; }
.bub .btxt.dots { color: var(--faint); letter-spacing: 4px; }
.bub .sent { justify-content: flex-start; margin: 0; }
.bub.b .sent { justify-content: flex-end; }
.bub .ben { font-size: 13px; color: var(--muted); margin-top: 2px; }
.chat.small { margin-top: 4px; gap: 6px; }
.chat.small .bub .btxt { font-size: 22px; }
.chat.small .bub .tz { font-size: 22px; }
.chat.small .bub .bbody { padding: 5px 11px; }
.chatex { cursor: pointer; }
.pmask { display: inline-block; min-width: 1.1em; color: var(--gold); border-bottom: 2px solid var(--gold); text-align: center; }
.optzh { display: flex; flex-direction: column; gap: 2px; }
.optzh .han { font-size: 24px; line-height: 1.25; }
.optpy { font-size: 13px; }
.opt.solved { border-style: dashed; }
.ctable { display: grid; gap: 4px; max-width: 620px; margin: 12px auto 0; text-align: left; }
.crow { display: grid; grid-template-columns: 1.1fr 1.2fr 1.6fr; gap: 10px; align-items: baseline; padding: 6px 10px; border-radius: 8px; background: var(--bg2); cursor: pointer; }
.crow .han { font-size: 22px; }

/* catch-up banner */
.card.catchup { border-color: var(--jade); background: linear-gradient(135deg, color-mix(in srgb, var(--jade) 10%, var(--card)), var(--card)); }

</style>

reads and writes these IDs. In Chinese, one character is usually 1 token, sometimes 2–3 depending on the tokenizer.","formula":"\"我爱你\" → [1234, 9921, 777]","game":"Every word you learn is added to your model's vocabulary. Vocab size on the dashboard = words you have seen.","quiz":{"q":"What does a language model actually take as input?","o":["Integer token IDs","Raw Unicode characters","Whole words from a dictionary","Pixel images of the text"],"a":0,"x":"Text is tokenized into IDs; the model embeds and processes those IDs."},"termIds":[1087,1088]},{"id":"nexttoken","lv":1,"title":"Next-token prediction","terms":[["预测","yùcè","to predict"]],"body":"Pre-training has one objective: given all previous tokens, predict a probability distribution over the next one. Generation is just this step on repeat: predict, pick a token, append it, predict again. Everything else (chat, code, translation) emerges from doing this at scale.","formula":"p(x<sub>t<\/sub> | x<sub>1<\/sub>, …, x<sub>t−1<\/sub>)","game":"In the Decoder mini-game you are the model: pick the next token, one step at a time.","quiz":{"q":"What is the pre-training objective of a GPT-style model?","o":["Predict the next token","Predict a masked middle token","Classify the sentence topic","Translate into English"],"a":0,"x":"Causal LMs maximize log p(next token | previous tokens)."},"termIds":[1089]},{"id":"bpe","lv":2,"title":"Tokenizers & BPE","terms":[["分词器","fēncíqì","tokenizer"]],"body":"<b>Byte-Pair Encoding<\/b> starts from single bytes and repeatedly merges the most frequent adjacent pair into a new token, until the vocabulary is full. Frequent words become one token, rare words split into pieces. Chinese is written without spaces, so splitting text into words (<i>中文分词<\/i>) is a classic NLP problem in its own right.","formula":"merge(most frequent pair) → repeat until |V| = N","game":"Unlocks the <b>Tokenizer<\/b> mini-game: segment Chinese sentences into words.","quiz":{"q":"What does BPE merge at each training step?","o":["The most frequent adjacent pair","The least frequent adjacent pair","Two random adjacent symbols","The longest repeated substring"],"a":0,"x":"Greedy merging of the most frequent adjacent pair builds the vocabulary."},"termIds":[1090]},{"id":"mlm","lv":2,"title":"Masked language modeling (BERT)","terms":[["掩码","yǎnmǎ","mask"]],"body":"Encoder models like <b>BERT<\/b> are pre-trained differently from GPT: about 15% of the tokens are hidden behind a <b>[MASK]<\/b> and the model predicts them from the context on <i>both<\/i> sides. GPT-style decoders only ever see the left side. Masked models are strong at understanding (classification, search, embeddings); decoders at generating. Chengyu are the perfect masked-LM exercise: four fixed tokens, so three of them almost fully determine the fourth.","formula":"p(x<sub>mask<\/sub> | x<sub>left<\/sub>, x<sub>right<\/sub>)","game":"The <b>Idiom<\/b> mini-game is masked language modeling by hand: fill in the [MASK].","quiz":{"q":"How is BERT pre-trained?","o":["Predict masked tokens from both sides","Predict only the next token","Translate sentence pairs","Rank answers by human preference"],"a":0,"x":"Masked LM uses bidirectional context; causal LMs use only the left context."},"termIds":[1131]},{"id":"embed","lv":2,"title":"Embeddings","terms":[["向量","xiàngliàng","vector"]],"body":"Each token ID indexes a row of a learned <b>embedding matrix<\/b>, giving a vector of e.g. 4096 numbers. Training pushes tokens used in similar contexts close together, so direction in this space carries meaning. 猫 and 狗 end up nearer to each other than to 银行.","formula":"e = E[id],  sim(a,b) = a·b / (‖a‖‖b‖)","game":"The Attention mini-game is you aligning words with their meanings: matching vectors.","quiz":{"q":"What is an embedding?","o":["A learned vector per token","A fixed one-hot code per token","A compressed copy of the text","A list of a token's synonyms"],"a":0,"x":"Embeddings map discrete token IDs to dense, learned vectors."},"termIds":[1091]},{"id":"softmax","lv":3,"title":"Logits & softmax","terms":[["概率","gàilǜ","probability"]],"body":"The last layer outputs one raw score, a <b>logit<\/b>, for every token in the vocabulary. <b>Softmax<\/b> exponentiates and normalizes them into probabilities that sum to 1. Bigger logit gaps mean a more confident model.","formula":"p<sub>i<\/sub> = e<sup>z<sub>i<\/sub><\/sup> / Σ<sub>j<\/sub> e<sup>z<sub>j<\/sub><\/sup>","game":"The activity mix of each epoch is sampled from a softmax. See Settings → Temperature.","quiz":{"q":"What does softmax guarantee about its outputs?","o":["Positive values that sum to 1","Integers between 0 and 9","Values sorted high to low","Values between −1 and 1"],"a":0,"x":"Exponentiation makes them positive, normalization makes them sum to 1."},"termIds":[1092]},{"id":"loss","lv":3,"title":"Cross-entropy & perplexity","terms":[["损失","sǔnshī","loss"]],"body":"Training minimizes <b>cross-entropy<\/b>: the negative log-probability the model gave to the correct next token. <b>Perplexity<\/b> is e<sup>loss<\/sup>, roughly how many options the model is torn between. Perplexity 1 = always certain and right.","formula":"L = −log p(correct),  PPL = e<sup>L<\/sup>","game":"Your epoch loss is a proxy: −mean log p, with Again≈0.15, Hard≈0.55, Good≈0.85, Easy≈0.95.","quiz":{"q":"A perplexity of 1 means the model…","o":["is always certain and right","is guessing uniformly at random","has exactly one parameter","has a one-token vocabulary"],"a":0,"x":"PPL = e^0 = 1 only when p(correct) = 1 every time."},"termIds":[1093]},{"id":"sft","lv":3,"title":"Chat fine-tuning (SFT)","terms":[["对话","duìhuà","dialogue; conversation"],["回复","huífù","reply; response"]],"body":"A pretrained model only continues text: ask it a question and it may happily continue with three more questions. <b>Supervised fine-tuning (SFT)<\/b> trains it further on (prompt, reply) pairs written in a chat template, so it learns to <i>answer<\/i>: <span class=\"mono\">&lt;|user|&gt;<\/span> 你吃了吗？ <span class=\"mono\">&lt;|assistant|&gt;<\/span> 吃了，你呢？ The loss is computed only on the reply tokens; the prompt is masked. The data is tiny compared with pretraining: LIMA (2023) showed that about a thousand carefully written examples already go a long way, because the knowledge is already there and SFT mostly teaches the <b>format and tone<\/b> of a good reply. That's what your dialogue cards do: the words come from pretraining (your vocabulary); now you learn which reply fits, with the right reactions (对对对, 好的好的) and mood particles (吧, 啊, 呢).","formula":"loss = −Σ<sub>t ∈ reply<\/sub> log p(x<sub>t<\/sub> | prompt, x<sub>&lt;t<\/sub>) · prompt tokens masked","game":"Dialogue cards and the Particles game: same words, a different reply or tone.","quiz":{"q":"During SFT, which tokens usually contribute to the loss?","o":["Only the assistant's reply tokens","Only the user's prompt tokens","Every token, including the system prompt","None: SFT uses rewards instead of a loss"],"a":0,"x":"Prompt tokens are masked: the model learns to produce replies, not to imitate users. Rewards come later, in RLHF/DPO."},"termIds":[1173,1174]},{"id":"quant","lv":4,"title":"Quantization basics","terms":[["量化","liànghuà","quantization"]],"body":"Weights are trained in 16/32-bit floats, but can be stored in fewer bits for inference. Map each float to a small integer with a <b>scale<\/b> s (and zero-point z), then dequantize on the fly. INT8 halves memory vs FP16, INT4 quarters it, usually with a small quality loss. Fewer bytes per weight also means faster, memory-bandwidth-bound decoding.","formula":"q = round(x/s) + z,  x̂ = s·(q − z)","game":"Unlocks <b>Quantize<\/b>: Mandarin tones squeeze a continuous pitch curve into 4 levels + neutral. Hear it, quantize it.","quiz":{"q":"Going from FP16 to INT4 shrinks weight memory by about…","o":["4×","2×","8×","16×"],"a":0,"x":"16 bits → 4 bits per weight is 4× (plus a little overhead for scales)."},"termIds":[1094]},{"id":"attention","lv":4,"title":"Self-attention","terms":[["注意力","zhùyìlì","attention"]],"body":"Every token emits a <b>query<\/b>, a <b>key<\/b> and a <b>value<\/b> vector. A token's output is a weighted average of all values, weighted by how well its query matches each key. This is how 他 can look back at the person it refers to. In a decoder, a causal mask blocks attention to future tokens.","formula":"Attn(Q,K,V) = softmax(QKᵀ / √d) V","game":"The <b>Attention<\/b> mini-game: match queries (hanzi) to keys (meaning / pinyin).","quiz":{"q":"Why divide QKᵀ by √d?","o":["Keep dot products from growing with d","Make attention faster on GPUs","Turn scores into probabilities","Add information about position"],"a":0,"x":"Large dot products saturate softmax; scaling keeps gradients healthy."},"termIds":[1095]},{"id":"multihead","lv":5,"title":"Multi-head attention","terms":[["多头","duōtóu","multi-head"]],"body":"Instead of one attention, run h <b>heads<\/b> in parallel, each with its own Q/K/V projections in a smaller subspace. Heads specialize: one may track syntax, another coreference, another position. Outputs are concatenated and projected back. Grouped-query attention (GQA) shares keys/values across heads to save memory.","formula":"MHA = Concat(head<sub>1<\/sub>…head<sub>h<\/sub>) W<sub>O<\/sub>","game":"Attention rounds alternate heads: meaning-head and pinyin-head.","quiz":{"q":"What does grouped-query attention (GQA) share across query heads?","o":["Key and value projections","Query and output projections","The token embeddings","The softmax temperature"],"a":0,"x":"Several query heads share one K/V head, shrinking the KV cache."},"termIds":[1096]},{"id":"rope","lv":5,"title":"Positional encoding (RoPE)","terms":[["位置","wèizhì","position"]],"body":"Attention by itself is order-blind: shuffling tokens shuffles outputs. Models inject position. <b>RoPE<\/b> rotates each query and key by an angle proportional to its position, so their dot product depends on relative distance. Chinese grammar leans heavily on word order: 我爱你 ≠ 你爱我.","formula":"q′ = R(θ·pos) q,  k′ = R(θ·pos) k","game":"The Decoder mini-game is all about order.","quiz":{"q":"Why do transformers need positional information?","o":["Attention by itself ignores order","Attention by itself is too slow","Softmax is undefined without it","Training cannot start without it"],"a":0,"x":"Without it, attention is permutation-invariant."},"termIds":[1097]},{"id":"induction","lv":5,"title":"Induction heads: copying from context","terms":[["复制","fùzhì","to copy"]],"body":"Some attention heads learn a simple, powerful trick: find an earlier place where the current token appeared and <b>copy the token that came after it<\/b>. Two heads work together: one marks \"which token came before me\", the other searches for that and attends to its successor. Anthropic researchers named these <b>induction heads<\/b> (2022) and found that they appear quite suddenly during training, right when the model gets much better at learning from its prompt (in-context learning). Copying from the context is one of the most useful things a language model does: names, numbers, code variables. Chinese yes/no answers work by copying too: 你喜欢吗？ → 喜欢！ The answer reuses the verb from the question.","formula":"[A][B] … [A] → predict [B]","game":"Echo: answer yes/no the Chinese way, by copying the verb from the question.","quiz":{"q":"What does an induction head do?","o":["Finds an earlier copy of the current token and predicts what followed it","Splits rare words into subword tokens","Stores the keys and values of past tokens","Normalizes activations between layers"],"a":0,"x":"[A][B] … [A] → [B]: a copy mechanism behind in-context learning."},"termIds":[1177]},{"id":"greedy","lv":6,"title":"Decoding: greedy","terms":[["解码","jiěmǎ","decoding"]],"body":"<b>Decoding<\/b> is how we turn next-token distributions into text. <b>Greedy<\/b> takes the argmax at every step: fast and deterministic, but it can miss sequences that are better overall, and tends to loop and repeat itself in open-ended text.","formula":"x<sub>t<\/sub> = argmax p(· | x<sub>&lt;t<\/sub>)","game":"Unlocks <b>Decoder<\/b>: build Chinese sentences token by token. Wrong tokens cost log-prob.","quiz":{"q":"Greedy decoding picks…","o":["The most likely token at each step","A random token from the top-k","The best of k full sequences","A token sampled at temperature 1"],"a":0,"x":"Argmax at every step, no look-ahead."},"termIds":[1098]},{"id":"temperature","lv":6,"title":"Temperature","terms":[["温度","wēndù","temperature"]],"body":"Divide logits by a <b>temperature<\/b> T before softmax. T &lt; 1 sharpens the distribution (more predictable), T &gt; 1 flattens it (more diverse, more mistakes), T → 0 approaches greedy. It's the single most-tuned decoding knob.","formula":"p<sub>i<\/sub> = softmax(z<sub>i<\/sub> / T)","game":"Settings → Temperature controls how varied your epochs are. Watch the bars change.","quiz":{"q":"Raising temperature above 1…","o":["Flattens the distribution","Sharpens the distribution","Removes the long tail","Shrinks the vocabulary"],"a":0,"x":"Dividing by T>1 shrinks logit gaps, so probabilities move toward uniform."},"termIds":[935]},{"id":"topkp","lv":7,"title":"Top-k & top-p sampling","terms":[["采样","cǎiyàng","sampling"]],"body":"Sampling from the full distribution occasionally picks junk from the long tail. <b>Top-k<\/b> keeps only the k most likely tokens. <b>Top-p<\/b> (nucleus) keeps the smallest set whose probabilities sum to ≥ p, renormalizes and samples. Top-p adapts: few candidates when the model is sure, many when it's not.","formula":"V<sub>p<\/sub> = min set with Σ p<sub>i<\/sub> ≥ p","game":"When the Decoder offers distractors, it shows only a top-k slice.","quiz":{"q":"Top-p = 0.9 keeps…","o":["Fewest tokens covering 90% of mass","The 90 most likely tokens","Only tokens with p ≥ 0.9","90% of the whole vocabulary"],"a":0,"x":"Nucleus sampling cuts the tail by cumulative mass."},"termIds":[1099]},{"id":"beam","lv":7,"title":"Beam search","terms":[["束搜索","shù sōusuǒ","beam search"]],"body":"<b>Beam search<\/b> keeps the k best partial sequences (beams), ranked by cumulative log-probability. Each step it expands every beam with candidate tokens and keeps the top k of the results. It finds higher-likelihood outputs than greedy, which is why translation and summarization love it. A <b>length penalty<\/b> divides the score by length<sup>α<\/sup> so short outputs don't win unfairly.","formula":"score = Σ log p(x<sub>t<\/sub>) / |x|<sup>α<\/sup>","game":"The Decoder mini-game is greedy decoding by hand. Beam search would keep your two best partial sentences alive at every step.","quiz":{"q":"Beam search with beam width 1 is the same as…","o":["Greedy decoding","Top-p sampling","Random sampling","Exhaustive search"],"a":0,"x":"Keeping one beam = argmax each step."},"termIds":[1100]},{"id":"ffn","lv":8,"title":"Feed-forward layers","terms":[["前馈","qiánkuì","feed-forward"],["参数","cānshù","parameter"]],"body":"After attention, each token passes alone through a small MLP: expand to ~4× width, apply a nonlinearity (today usually SwiGLU), project back. These layers hold about two-thirds of a model's <b>parameters<\/b> and are thought to store much of its factual knowledge.","formula":"FFN(x) = W<sub>2<\/sub> · σ(W<sub>1<\/sub> x)","game":"Your parameter count grows with mature words.","quiz":{"q":"Where do most parameters of a dense transformer live?","o":["Feed-forward (MLP) layers","Attention Q/K/V projections","Layer normalization","Positional encodings"],"a":0,"x":"The 4× wide MLPs dominate the parameter count."},"termIds":[1101,1102]},{"id":"residual","lv":8,"title":"Residuals & normalization","terms":[["残差","cánchā","residual"]],"body":"Each block adds its output to its input: x + f(x). These <b>residual connections<\/b> give gradients a highway through 100+ layers. <b>RMSNorm/LayerNorm<\/b> keeps activations at a stable scale; modern models normalize before each sub-layer (pre-norm).","formula":"x ← x + Attn(Norm(x));  x ← x + FFN(Norm(x))","game":"Old words keep flowing through your reviews like a residual stream.","quiz":{"q":"What do residual connections mainly help with?","o":["Training very deep networks","Shrinking the vocabulary","Reducing quantization error","Speeding up tokenization"],"a":0,"x":"They keep gradients flowing through many layers."},"termIds":[1103]},{"id":"training","lv":9,"title":"Training: gradients & AdamW","terms":[["训练","xùnliàn","to train"]],"body":"Backpropagation computes how the loss changes with every weight. <b>AdamW<\/b> updates weights using running averages of gradients (momentum) and their squares (per-weight step sizes), plus decoupled weight decay. A short learning-rate warm-up and a cosine decay are the standard schedule.","formula":"θ ← θ − η · m̂ / (√v̂ + ε) − η λ θ","game":"Every review is one training step for your brain.","quiz":{"q":"What does Adam keep for every weight?","o":["Moving averages of gradient and its square","A copy of the weight's initial value","How many times it was updated","Its value from the previous epoch"],"a":0,"x":"First and second moment estimates give momentum and adaptive step sizes."},"termIds":[1104]},{"id":"fsrs","lv":9,"title":"Spaced repetition (FSRS)","terms":[["记忆","jìyì","memory"]],"body":"This game schedules words with <b>FSRS<\/b>, the algorithm Anki also offers. Each word has a <b>stability<\/b> S (days until recall chance falls to 90%) and a <b>difficulty<\/b> D. Recall decays as a power law; the next review is set when predicted recall hits your target retention. FSRS's own parameters were fitted with gradient descent on millions of real reviews: ML scheduling ML-style learning.","formula":"R(t) = (1 + 19/81 · t/S)<sup>−0.5<\/sup>","game":"Settings → Desired retention trades workload against forgetting.","quiz":{"q":"In FSRS, stability S is…","o":["Days until recall chance falls to 90%","How many times you've reviewed it","How hard the word is, from 1 to 10","Days since you first learned it"],"a":0,"x":"By definition R(S) = 0.9."},"termIds":[1105]},{"id":"kvcache","lv":10,"title":"KV cache","terms":[["缓存","huǎncún","cache"]],"body":"When generating, the keys and values of earlier tokens never change, so they're stored in a <b>KV cache<\/b>. Each new token computes only its own Q, K, V and attends to the cache, making generation linear per step instead of re-running the whole prefix. The cache grows with context length × layers × KV heads and often dominates GPU memory for long contexts.","formula":"mem ≈ 2 · layers · kv_heads · d<sub>head<\/sub> · seq_len · bytes","game":"You don't reread a sentence from the start for every new word, either.","quiz":{"q":"What does the KV cache store?","o":["Keys and values of past tokens","Queries of past tokens","Gradients of the last step","Logits of past tokens"],"a":0,"x":"Past K/V are reused at every step."},"termIds":[1106]},{"id":"int4","lv":11,"title":"INT4 & group-wise quantization","terms":[["精度","jīngdù","precision"]],"body":"One scale for a whole matrix lets a few large outliers ruin precision for everything else. <b>Group-wise<\/b> quantization uses one scale (and zero-point) per small group, e.g. 128 weights, so outliers only hurt locally. Most 4-bit formats in practice (GPTQ/AWQ checkpoints, GGUF Q4_K) work this way.","formula":"bits/weight ≈ 4 + 16/group_size","game":"In Quantize, a higher streak drops your bit-width: harder, more XP.","quiz":{"q":"Why use a separate scale per group of weights?","o":["Outliers only distort their own group","It removes rounding error completely","It lets each weight use 1 bit","It avoids storing any scales at all"],"a":0,"x":"Local scales adapt to local ranges."},"termIds":[1107]},{"id":"gptq","lv":12,"title":"GPTQ","terms":[["误差","wùchā","error"]],"body":"<b>GPTQ<\/b> quantizes a trained model layer by layer, with no retraining. Inside a layer it rounds weights one column at a time and, after each column, adjusts the not-yet-quantized columns to cancel the rounding error. The adjustment uses the inverse <b>Hessian<\/b> H = 2XXᵀ estimated from a small calibration set (~128 samples). That second-order trick (from Optimal Brain Surgeon) brings 100B+ models to 3–4 bits in a few GPU hours.","formula":"min ‖WX − ŴX‖²,  H = 2XXᵀ","game":"Like reviewing a word you missed: the error gets fed back so the rest compensates.","quiz":{"q":"How does GPTQ compensate rounding error?","o":["Adjusts later columns via the inverse Hessian","Fine-tunes the full model after rounding","Keeps the largest weights in FP16","Rounds each weight up or down at random"],"a":0,"x":"Second-order error feedback into unquantized columns."},"termIds":[1108]},{"id":"awq","lv":13,"title":"AWQ","terms":[["权重","quánzhòng","weight"]],"body":"<b>Activation-aware Weight Quantization<\/b> notices that ~1% of weight channels matter far more, the ones that see large activations. Before quantizing, AWQ scales those channels up (and the matching activations down, an exact equivalent transform) so they keep more precision. There's no backprop or reconstruction, so it's fast and generalizes well.","formula":"y = (W·s)(x/s),  s chosen from activation statistics","game":"Your leech words get extra attention, same idea.","quiz":{"q":"Which weights does AWQ protect?","o":["Channels that see large activations","Weights with the largest magnitude","The embedding and output layers","Weights with the largest gradients"],"a":0,"x":"Salience comes from activation magnitude, not weight magnitude."},"termIds":[1109]},{"id":"hparams","lv":14,"title":"Decoding hyperparameters","terms":[["超参数","chāocānshù","hyperparameter"]],"body":"Temperature, top-p, top-k, beam width and penalties are <b>inference hyperparameters<\/b>: no retraining, but large effects on quality. The best setting depends on the task (code vs. stories) and on the model itself. Quantization nudges the logits, so a setting tuned for the full-precision model isn't automatically best for its quantized version.","formula":"θ* = argmax<sub>θ<\/sub> quality(model, decode(θ))","game":"Your own hyperparameters: new words/day, retention, temperature.","quiz":{"q":"Which of these is an inference (decoding) hyperparameter?","o":["Top-p","Learning rate","Batch size","Weight decay"],"a":0,"x":"Top-p only matters at generation time."},"termIds":[1110]},{"id":"lora","lv":15,"title":"LoRA & QLoRA","terms":[["微调","wēitiáo","fine-tuning"]],"body":"Full fine-tuning updates every weight. <b>LoRA<\/b> freezes W and learns a low-rank update ΔW = BA with rank r ≪ d, often &lt;1% of the parameters. <b>QLoRA<\/b> keeps the frozen base in 4-bit (NF4) and trains LoRA adapters on top, so a large model can be fine-tuned on a single GPU.","formula":"W′ = W + BA,  B ∈ ℝ<sup>d×r<\/sup>, A ∈ ℝ<sup>r×k<\/sup>","game":"Fine-tune mode drills your weak words without touching the schedule.","quiz":{"q":"LoRA trains…","o":["A low-rank update, base weights frozen","All weights, at a lower learning rate","Only the embedding table","Only the final output layer"],"a":0,"x":"ΔW = BA with small rank r."},"termIds":[1111]},{"id":"specdec","lv":16,"title":"Speculative decoding","terms":[["推测","tuīcè","to speculate"]],"body":"A small, fast <b>draft model<\/b> proposes several tokens ahead; the big model checks all of them in a single forward pass. A clever accept/reject rule guarantees the final output has exactly the big model's distribution, often with 2–3× speed-ups.","formula":"accept x with prob min(1, p<sub>big<\/sub>(x) / p<sub>draft<\/sub>(x))","game":"Guess a word fast, then verify: what you do on every card.","quiz":{"q":"Does speculative decoding change the big model's output distribution?","o":["No, the accept rule keeps it exact","Yes, quality drops slightly","Only when temperature is 0","Only for 4-bit models"],"a":0,"x":"Rejection sampling preserves the target distribution."},"termIds":[1112]},{"id":"moe","lv":17,"title":"Mixture of Experts","terms":[["专家","zhuānjiā","expert"]],"body":"In an <b>MoE<\/b> layer the single FFN is replaced by many expert FFNs and a router that sends each token to the top-k (often 2) of them. Total parameters can be huge while compute per token stays small, since only a few experts run.","formula":"y = Σ<sub>i∈topk<\/sub> g<sub>i<\/sub>(x) · E<sub>i<\/sub>(x)","game":"Each mini-game is an expert; the epoch planner is the router.","quiz":{"q":"Why can an MoE model have huge parameter counts but modest compute per token?","o":["Only a few experts run per token","Experts share all of their weights","Attention is skipped for most tokens","Experts run in 1-bit precision"],"a":0,"x":"Sparse activation: top-k routing."},"termIds":[1113]},{"id":"scaling","lv":18,"title":"Scaling laws","terms":[["规模","guīmó","scale"]],"body":"Loss falls as a smooth <b>power law<\/b> in parameters, data and compute. Chinchilla showed many big models were under-trained: compute-optimal training uses roughly 20 tokens per parameter. Today models are often trained far beyond that, because inference is cheaper for smaller models.","formula":"L(N, D) ≈ E + A/N<sup>α<\/sup> + B/D<sup>β<\/sup>","game":"More reviews, lower loss. Slowly, but predictably.","quiz":{"q":"Chinchilla's compute-optimal rule of thumb is about…","o":["20 tokens per parameter","1 token per parameter","200 tokens per parameter","2000 tokens per parameter"],"a":0,"x":"Roughly D ≈ 20·N."},"termIds":[1114]},{"id":"context","lv":19,"title":"Context length & FlashAttention","terms":[["上下文","shàngxiàwén","context"]],"body":"Attention compares every token with every other: cost grows with n². <b>FlashAttention<\/b> computes exactly the same result but in tiles that fit in fast on-chip SRAM, never writing the n×n matrix to GPU memory. With RoPE scaling tricks, context windows grew from 2k to 100k+ tokens.","formula":"time O(n² d), memory O(n) with tiling","game":"Longer sentences unlock as your vocabulary grows.","quiz":{"q":"What does FlashAttention change?","o":["Memory access; the result stays exact","The math, to a fast approximation","The number of attention heads","The tokenizer's vocabulary"],"a":0,"x":"It's IO-aware but exact."},"termIds":[1115]},{"id":"rlhf","lv":20,"title":"RLHF & DPO","terms":[["反馈","fǎnkuì","feedback"]],"body":"After pre-training and supervised fine-tuning, models are aligned with human preferences. <b>RLHF<\/b> trains a reward model on ranked answers, then optimizes the LLM with RL (e.g. PPO) under a KL penalty to stay near the original. <b>DPO<\/b> skips the reward model and optimizes directly on preference pairs.","formula":"max E[r(x,y)] − β · KL(π ‖ π<sub>ref<\/sub>)","game":"Your Again/Hard/Good/Easy ratings are the human feedback for your scheduler.","quiz":{"q":"What does DPO remove compared to classic RLHF?","o":["The reward model and the RL loop","The supervised fine-tuning stage","The human preference data","The reference model entirely"],"a":0,"x":"DPO turns preference learning into a simple classification-style loss."},"termIds":[1116]},{"id":"penalty","lv":22,"title":"Repetition & length penalties","terms":[["惩罚","chéngfá","penalty"]],"body":"A <b>repetition penalty<\/b> lowers logits of tokens already generated (frequency/presence penalties do this by count). A <b>length penalty<\/b> in beam search controls the bias toward short outputs. Both are blunt tools: too strong and the text gets odd.","formula":"z<sub>i<\/sub> ← z<sub>i<\/sub> / ρ  if token i already appeared","game":"The planner penalizes repeating the same mini-game twice in a row.","quiz":{"q":"A repetition penalty works by…","o":["Lowering logits of tokens already used","Raising temperature after each token","Deleting tokens from the vocabulary","Shortening the prompt automatically"],"a":0,"x":"It adjusts logits of seen tokens."},"termIds":[1117]},{"id":"distill","lv":24,"title":"Knowledge distillation","terms":[["蒸馏","zhēngliú","distillation"]],"body":"A small <b>student<\/b> model learns to match a big <b>teacher<\/b>'s full output distribution rather than only the correct token. The soft probabilities carry extra signal (which wrong answers are almost right), so students learn more per example.","formula":"L = KL(p<sub>teacher<\/sub> ‖ p<sub>student<\/sub>)","game":"Distractors in multiple choice are chosen to be almost right on purpose.","quiz":{"q":"Distillation trains the student on…","o":["The teacher's soft probabilities","Only the teacher's argmax labels","The teacher's weights directly","Random labels for regularization"],"a":0,"x":"Soft targets carry dark knowledge."},"termIds":[1118]},{"id":"prune","lv":26,"title":"Pruning & sparsity","terms":[["剪枝","jiǎnzhī","pruning"]],"body":"<b>Pruning<\/b> removes weights that matter least. Structured 2:4 sparsity (2 zeros in every 4 weights) gets hardware speed-ups on modern GPUs. <b>SparseGPT<\/b> prunes in one shot using the same second-order error compensation idea as GPTQ, reaching ~50% sparsity on large models with little loss.","formula":"2:4 sparsity → 50% zeros","game":"Suspend words you already know: prune them from your queue.","quiz":{"q":"SparseGPT is closely related to which quantization method?","o":["GPTQ","AWQ","LoRA","BPE"],"a":0,"x":"Same authors, same Hessian-based error compensation."},"termIds":[1119]}],"idioms":[["马马虎虎",[["mǎ",3],["mǎ",3],["hū",1],["hū",1]],["horse","horse","tiger","tiger"],"so-so; careless, sloppy","A folk story tells of a painter whose half-tiger, half-horse picture confused his sons; the phrase became a byword for carelessness. In daily speech it just means \"so-so\".","everyday",""],["好久不见",[["hǎo",3],["jiǔ",3],["bú",2],["jiàn",4]],["very","long","not","see"],"long time no see","A set phrase rather than a classical idiom. English \"long time no see\" is often said to be a word-for-word copy of it.","everyday",""],["一路平安",[["yí",2],["lù",4],["píng",2],["ān",1]],["one","road","peaceful","safe"],"have a safe trip","Said when seeing someone off.","wish",""],["一路顺风",[["y o visit, he fled in terror.","story",""],["卧薪尝胆",[["wò",4],["xīn",1],["cháng",2],["dǎn",3]],["lie on","brushwood","taste","gall"],"to endure hardship to prepare a comeback","After his defeat, King Goujian slept on brushwood and tasted bitter gall every day so he would never forget.","story",""]],"spoken":[[168,"react","Yes / right. Doubled for eager agreement: 对对对！ duì duì duì = \"yes yes, exactly!\" · 对吧？ = \"right?\"",0],[1135,"react","Agreeing to do something: \"OK, will do\". 好的好的 = \"sure, sure, got it\". Warmer than a plain 好, more willing than 好吧.",1],[1136,"react","A clear, polite \"yes, that's right\". 是的是的 = \"yes, yes, indeed\". Among friends people often just say 对 or 嗯.",1],[1137,"react","The listening sound: \"mm-hm, I'm with you\". 嗯嗯 is the friendly doubled version, very common in chats. A rising 嗯？ = \"hm? what?\"",1],[599,"particle","Adds feeling: 好啊！ \"sure!\" (happy yes) · 是啊 \"yeah, true\" · 你说啊 \"well, say it!\". Without it many replies sound flat and stiff. After some sounds it becomes 呀 or 哪 (天哪).",0],[170,"particle","Softens a sentence. Suggestion: 我们走吧 \"let's go\" · guess: 你是学生吧？ \"you're a student, right?\" · reluctant OK: 好吧 \"fine…\"",0],[52,"func","\"also, too\": always right before the verb or adjective, never at the start. 我也是 \"me too\" · 我也不知道 \"I don't know either\".",0],[17,"particle","Bounces a question back: 你呢？ \"and you?\" · \"where is…?\": 我的手机呢？ · something going on right now, like 在: 他睡觉呢 \"he's sleeping\" · 我开玩笑呢 \"I'm joking\" · lively \"still\": 还早呢！ \"it's still early!\"",0],[11,"particle","Turns a statement into a yes/no question: 你是学生吗？ Never together with question words like 什么, 哪儿, 谁.",0],[1138,"react","\"Oh, I see\" when something clicks. 哦哦 = \"ahh, OK\". A rising 哦？ (ó) = \"oh? really?\"",1],[1139,"react","真的吗？ \"really?\" · 真的！ \"seriously!\" · 真的假的？ \"for real??\" (lit. \"true or fake\")",1],[1140,"react","Answer to thanks, sorry or \"are you OK?\": 没事没事 \"no worries\". 没事吧？ = \"are you OK?\"",1],[49,"func","After a verb = done: 我吃了 \"I ate\". At the end = a change of state: 下雨了 \"it's raining now\" · 我懂了 \"got it!\" · 我走了 \"I'm off\". With feelings it means \"by now\": 你饿了吗？ \"are you hungry yet?\" · 你好一点儿了吗？ \"feeling better?\" (你饿吗？ and 你饿不饿？ are natural too, just without the \"by now\".) Pattern: 太好了！",0],[42,"func","Two jobs. \"at, in\": 我在家 \"I'm at home\". Before a verb = \"-ing, right now\": 我在吃饭 \"I'm eating\". Casual: 我吃饭呢 or 我在吃饭呢. 正在 = \"right in the middle of\". 还在下雨 = \"it's still raining\".",0],[7,"func","\"not\" for now, the future and habits: 我不吃 \"I won't eat / I don't eat that\" · 不去了 \"not going anymore\". 是 → 不是. Never 不有: that's 没有.",0],[158,"func","\"didn't, haven't\": 我没吃 \"I didn't eat\" · 还没 \"not yet\" · 没去过 \"never been\". 有 → 没有. Contrast: 不吃 = won't, 没吃 = didn't.",0],[165,"func","\"just, exactly\": 就是这个 \"it's exactly this\" · 我就在这儿 \"I'm right here\". \"then\": 你去我就去 \"if you go, I go\". Feels sooner than expected (opposite of 才).",0],[169,"func","\"still\": 他还在睡觉 · \"also\": 还有… \"and also…\" · 还行 \"it's OK, not bad\". (Same character as huán \"to return\", different word.)",0],[55,"func","\"all, both\", right before the verb: 我们都去 \"we're all going\". 都…了 = \"already!\": 都十点了！ \"it's already ten!\"",0],[1141,"react","Laughing. In chats 哈哈哈 = lol; the more 哈, the funnier.",1],[1142,"react","Polite refusal of help: 不用，谢谢！ \"no need, thanks!\" · 不用了 \"it's fine, don't\".",1],[1143,"react","Answer to a request: 能帮我吗？ — 没问题！ \"sure, no problem!\"",1],[1082,"react","\"OK, works for me\". 行吗？ \"is that OK?\" · 不行 \"no way / that won't work\" · 行行行 \"fine, fine, fine\" (a bit impatient).",0],[131,"func","太…了 = \"so…!\": 太好了！ \"great!\" · 太贵了 \"way too expensive\". Keep the 了 at the end.",0],[1144,"filler","Brings up something new: 对了，你明天来吗？ \"oh right, are you coming tomorrow?\"",1],[1145,"react","Lighter than 对不起: for being late, bumping into someone, asking a stranger. 不好意思，… = \"excuse me, …\"",1],[1146,"react","\"Never mind, let it go\". 算了算了 = \"oh, forget it\". Can sound resigned.",1],[1044,"spoken","\"to joke\". Just kidding: 开玩笑的！ / 我开玩笑的啦 · in the middle of joking: 我在开玩笑 / 我开玩笑呢 · 别开玩笑了 \"stop joking / you're kidding\".",0],[1176,"react","Modest \"I'm OK, not too bad\": 你累了吧？ — 还好。 Also \"luckily\": 还好你来了 \"good thing you came\".",1],[192,"func","After a verb it makes a request small and polite: 等一下 \"wait a sec\" · 看一下 \"take a look\" · 休息一下 \"rest a bit\".",0],[1147,"filler","\"that one\", and the most common \"um…\" while thinking: 那个…你有时间吗？ Spoken nèige (or nàge).",1],[1148,"filler","就是！ \"exactly!\" when agreeing · 就是… \"it's just… / I mean…\" before explaining.",1],[331,"filler","\"and then…\": stories run on 然后…然后… It also fills pauses.",0],[1149,"react","Amazed: 哇，好漂亮！ \"wow, so pretty!\"",1],[1150,"react","Shock or amazement (lit. \"oh heaven\"). Fine in any company.",1],[1151,"react","Mild dismay: 哎呀，我忘记了！ \"oh no, I forgot!\" Also when something goes wrong or someone teases you.",1],[1152,"react","Cheering someone on (lit. \"add oil\"): before exams, at sports games, for hard work. 加油加油！",1],[1153,"react","Seeing someone again after a while. Answer: 是啊，好久不见！",1],[1154,"react","From English \"bye-bye\": casual. 再见 is more neutral.",1],[1155,"react","Said before going to sleep, not as an evening greeting.",1],[174,"react","可以！ \"sure, go ahead\" · 可以吗？ \"may I? is that OK?\" · 还可以 \"it's OK, so-so\".",0],[341,"react","当然！ \"of course!\" · 当然可以 \"of course you can\".",0],[1156,"particle","Makes it sound obvious or pleading: 我不饿嘛 \"I'm just not hungry!\" · 来嘛！ \"oh come on, come!\" Same sound as 吗, different job.",1],[1157,"particle","了 + 啊 in one sound: light and relaxed. 我走啦！ \"I'm heading out, bye!\" (friendlier than 我走了) · 下雨啦！ \"look, it's raining!\" · 不知道啦 \"dunno~\" · 开玩笑的啦 \"just kidding!\" · 好啦好啦 \"OK, OK\".",1],[1080,"particle","啊 after a vowel, softer and friendlier: 谁呀？ \"who is it?\" · 你呀… \"oh, you…\"",0],[1158,"react","A sigh: tired, sad or resigned. 唉，又下雨了。 \"Ugh, raining again.\"",1],[1159,"func","For things you don't like: 有点儿累 \"a bit tired\" · 有点儿贵 \"a bit pricey\". Not for compliments: say 很好看, not 有点儿好看.",1],[1160,"react","Understated praise: 不错！ \"nice!\" · 还不错 \"pretty good\". Chinese praise is often modest like this.",1],[328,"react","\"so-so, average\": 电影怎么样？ — 一般吧。",0],[1161,"spoken","The everyday \"happy\": 我今天很开心. 高兴 is similar, a bit more formal.",1],[1162,"spoken","\"fun\" for games, places and people: 太好玩儿了！",1],[1163,"spoken","\"interesting\": 很有意思 · 没意思 \"boring\".",1],[1164,"filler","这样啊 \"oh, I see\" (when you learn something) · 就是这样 \"exactly like that\".",1],[835,"react","\"impressive!\": 你好厉害！ \"you're amazing!\" · 太厉害了！",0],[815,"react","辛苦了！ \"thanks for your hard work / you must be worn out\": said to someone who worked hard, often for you.",0],[1057,"react","\"whatever, anything's fine\": 吃什么？ — 随便。 Careful: it can sound like you don't care.",0],[1165,"spoken","Old-school modest reply to praise: 哪里哪里 \"oh, not at all\". Many young people just say 谢谢 or 哈哈.",1],[1166,"react","Getting attention: 嘿！你也在这儿？ \"hey! you're here too?\"",1],[1167,"slang","Northern spoken 什么: 啥？ \"what?\" · 这是啥？ \"what's this?\"",1],[1168,"spoken","Casual for 做什么 or 为什么: 你干嘛呢？ \"what are you up to?\" · 干嘛不去？ \"why not go?\"",1],[1169,"filler","\"anyway\": 去吧，反正你有时间。 \"go, you've got time anyway.\"",1],[340,"filler","\"actually…\" to correct or admit something gently: 其实我不喜欢咖啡。",0],[317,"func","\"again\" for something that already happened: 他又迟到了！ Often a bit annoyed.",0],[318,"func","\"not until, only then\": 他十点才来 \"he didn't show up until ten\": later than expected, the opposite feel of 就.",0],[193,"func","\"again\" for the future: 再说一遍 \"say it again\" · 再来一杯 \"one more cup\". 再见 = \"see you again\".",0],[189,"func","\"already\": 我已经吃了。 Usually with 了 at the end.",0],[1170,"slang","Surprise among friends (lit. \"I go\"): 我去，太贵了吧！ Harmless, but casual.",1],[1171,"slang","Slang praise: 牛！ / 太牛了！ \"awesome!\" (lit. \"cow\"). Very commo const $ = (sel, root = document) => root.querySelector(sel);

const clamp = (x, a, b) => Math.max(a, Math.min(b, x));

function shuffle(a) { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; }
const esc = s => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const fmt1 = x => (Math.round(x * 10) / 10).toString();
function fmtIvl(days) {
  if (days < 1) return '<1d';
  if (days < 30) return Math.round(days) + 'd';
  if (days < 365) return fmt1(days / 30) + 'mo';
  return fmt1(days / 365) + 'y';
}
function fmtTime(ms) { const s = Math.floor(ms / 1000); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function sample(probs) { let r = Math.random(), acc = 0; for (let i = 0; i < probs.length; i++) { acc += probs[i]; if (r < acc) return i; } return probs.length - 1; }
function softmax(logits, T) { const z = logits.map(l => l / Math.max(T, 1e-3)); const m = Math.max(...z); const e = z.map(v => Math.exp(v - m)); const s = e.reduce((a, b) => a + b, 0); return e.map(v => v / s); }

const DAY_MS = 864e5;
function dayIndex(ts = Date.now()) {

const TTS = (() => {

      (/natural|xiaoxiao|yunxi|neural/i.test(v.name) ? 5 : 0) + (/google/i.test(v.name) ? 3 : 0);

/* ---------- epoch engine ---------- */
function startEpoch(opts = {}) {
  const practice = !!opts.practice;
  let main = [];
  if (practice) {
    const ids = seenIds().filter(id => !isSusp(id))
      .sort((a, b) => (S.cards[b].leech ? 1 : 0) - (S.cards[a].leech ? 1 : 0) || FSRS.retrievability(S.cards[a]) - FSRS.retrievability(S.cards[b]))
      .slice(0, 15);
    if (!ids.length) { toast('Nothing to fine-tune yet. Learn some words first.'); return; }
    main = shuffle(ids).map(id => ({ id, kind: 'rev' }));
  } else {
    // reviews: capped per epoch so a backlog becomes several normal-sized epochs; with a backlog, most-forgotten first
    const bl = backlogInfo();
    const cap = bl.cap;
    let due = dueIds();
    if (S.settings.catchUp !== false && due.length > cap) due = due.sort((a, b) => FSRS.retrievability(S.cards[a]) - FSRS.retrievability(S.cards[b])).slice(0, cap);
    main = due.map(id => ({ id, kind: 'rev' }));
    // new words don't go into the queue: they wait in a pool and are let in one at a time (see nextItem)
    var newPool = newQueue(newLeftToday());
    // sentence cards: only sentences whose words are all known before this epoch starts
    const sdue = dueSentKeys().slice(0, bl.active ? Math.round(cap * 0.3) : 80).map(key => ({ key, kind: 'srev' }));
    const snew = newSentKeys(newSentLeftToday()).map(key => ({ key, kind: 'snew', first: true }));
    main = mixSentences(main, sdue, snew);
    // idiom cards: a rare side dish (1 new every few days, at most 3 reviews per epoch)
    const idue = dueIdiomKeys().slice(0, 3).map(ikey => ({ ikey, kind: 'irev' }));
    const inew = newIdiomKeys(newIdiomLeftToday()).map(ikey => ({ ikey, kind: 'inew' }));
    main = mixIdioms(main, idue, inew);
    // dialogue cards (chat fine-tuning): only dialogues whose words are all known before the epoch starts
    const ddue = dueDlgKeys().slice(0, bl.active ? Math.round(cap * 0.2) : 40).map(dkey => ({ dkey, kind: 'drev' }));
    const dnew = newDlgKeys(newDlgLeftToday()).map(dkey => ({ dkey, kind: 'dnew', first: true }));
    main = mixDialogues(main, ddue, dnew);
    if (!main.length && !newPool.length) { toast('Nothing due. Add new words or fine-tune.'); return; }
  }
  const nReviews = main.length;
  const pool = typeof newPool !== 'undefined' ? newPool : [];
  SESS = {
    newPool: pool, newStart: pool.length, sinceNew: 0, newPaused: false, pausedOnce: false,
    warmup: Math.min(12, Math.round(nReviews * 0.25)), newGap: pool.length ? Math.max(1, Math.min(4, Math.floor(Math.max(0, nReviews - Math.min(12, Math.round(nReviews * 0.25))) / (pool.length + 1)))) : 0,
    catchUp: !practice && backlogInfo().active,
    start: Date.now(), main, learn: [], step: 0, total: main.length + main.filter(x => x.kind === 'new').length * 2,
    done: 0, grades: [], xp: 0, nNew: 0, nSentNew: 0, nIdiomNew: 0, nDlgNew: 0, words: {}, sents: {}, idioms: {}, dlgs: {}, practice, sinceGame: 0, nextGameAt: randInt(5, 8), lastGame: null, games: 0,
    epochNo: S.epochs.length + 1,
  };
  VIEW = 'session'; renderTop();
  $('#main').innerHTML = `<div class="sessbar" id="sessbar"></div><div class="stage" id="stage"></div>`;
  nextItem();
}

function lossChart(eps) {
  const W = 900, H = 170, P = 30;
  const vals = eps.map(e => e.loss);
  const hi = Math.max(...vals, 0.5) * 1.1, lo = 0;
  const x = i => P + i / Math.max(1, vals.length - 1) * (W - P * 2);
  const y = v => H - P + 8 - (v - lo) / (hi - lo) * (H - P * 2);
  const d = vals.map((v, i) => `${i ? 'L' : 'M'}${x(i).toFixed(1)},${y(v).toFixed(1)}`).join(' ');
  const ticks = [0, hi / 2, hi].map(v => `<text x="2" y="${y(v) + 3}">${v.toFixed(2)}</text><line x1="${P}" x2="${W - P}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-dasharray="3 4"/>`).join('');
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="none">${ticks}
    <path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2.5" vector-effect="non-scaling-stroke"/>
    ${vals.map((v, i) => `<circle cx="${x(i)}" cy="${y(v)}" r="3" fill="var(--accent)"><title>epoch ${S.epochs.length - vals.length + i + 1}: loss ${v.toFixed(3)} · PPL ${Math.exp(v).toFixed(2)}</title></circle>`).join('')}
    <text x="${W - P}" y="${H - 4}" text-anchor="end">epochs →</text></svg>`;
}

//  - buttons inside a card with a field don't take focus away from it
const IME = { composing: false };
document.addEventListener('compositionstart', () => { IME.composing = true; }, true);
document.addEventListener('compositionend', () => { IME.composing = false; }, true);
function stageInput() {
  if (VIEW !== 'session' && VIEW !== 'game') return null;
  const el = $('#stage input.typein:not([disabled])');
  return el && el.offsetParent !== null ? el : null;
}
function focusStageInput() {
  const el = stageInput();
  if (!el || document.activeElement === el || modalStack.length) return false;
  el.focus();
  return true;
}
const isEditable = t => !!t && !t.disabled && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.tagName === 'SELECT' || t.isContentEditable);
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const editable = isEditable(e.target);
  if (e.isComposing || e.keyCode === 229 || e.key === 'Process' || IME.composing) {
    if (!editable) focusStageInput();
    return;
  }
  if (editable && e.key !== 'Escape' && e.key !== 'Enter') return;
  if (!editable && (e.key.length === 1 || e.key === 'Backspace') && e.key !== ' ' && focusStageInput()) return;
  if (KEYH && KEYH(e)) { e.preventDefault(); return; }
});
document.addEventListener('mousedown', e => {

function playableSents(minTok = 2, maxChars = 18) {
  return SENTS.filter(s => s.w.every(w => w < 0 || isSeen(w)) && s.w.filter(w => w >= 0).length >= minTok && sentText(s).length <= maxChars);
}
function weakSeen(n, filter = () => true) {
  const ids = seenIds().filter(id => !isSusp(id) && filter(WORDS[id]));
  ids.sort((a, b) => FSRS.retrievability(S.cards[a]) - FSRS.retrievability(S.cards[b]));
  return shuffle(ids.slice(0, Math.max(n * 3, 12))).slice(0, n);
}
function pickDistinct(ids, n) {
  const out = [];
  for (const id of shuffle(ids)) { if (out.length >= n) break; if (out.every(o => !conflicts(WORDS[o], WORDS[id]))) out.push(id); }
  return out;
}

  },

};
function gameUnlocked(k) { const n = GAMES[k].note; return !n || NOTE_BY_ID[n].lv <= levelInfo().level; }
