/* ---------- 1. Attention ---------- */
function gameAttention(el, done) {
  const heads = ['meaning', 'pinyin'];
  let round = 0, mistakes = 0, pairs = 0;
  const t0 = Date.now();
  const heatmaps = [];
  function play() {
    const head = heads[round];
    const ids = pickDistinct(weakSeen(12), 5);
    const keys = shuffle(ids);
    const A = ids.map(() => keys.map(() => 0));
    const matched = new Set();
    let sel = null; // {side:'q'|'k', i}
    el.innerHTML = `<div class="explain">Head ${round + 1}/2 · <b>${head}</b>. Each query (汉字) must attend to the key that matches its ${head}. Click a query, then its key. <kbd>1</kbd>–<kbd>5</kbd> queries, <kbd>6</kbd>–<kbd>0</kbd> keys.</div>
      <div class="attn" id="attn"><svg id="attnsvg"></svg>
        <div class="col">${ids.map((id, i) => `<button class="it" data-q="${i}"><span class="k mono faint">${i + 1}</span><span class="hzo">${esc(WORDS[id].h)}</span></button>`).join('')}</div>
        <div class="col">${keys.map((id, j) => `<button class="it" data-k="${j}"><span class="k mono faint">${(j + 6) % 10}</span><span>${head === 'meaning' ? esc(WORDS[id].m) : `<span style="font-size:20px">${esc(WORDS[id].p)}</span>`}</span></button>`).join('')}</div>
      </div>`;
    const qs = $$('[data-q]', el), ks = $$('[data-k]', el);
    function line(i, j) {
      const box = $('#attn').getBoundingClientRect();
      const a = qs[i].getBoundingClientRect(), b = ks[j].getBoundingClientRect();
      const x1 = a.right - box.left, y1 = a.top + a.height / 2 - box.top, x2 = b.left - box.left, y2 = b.top + b.height / 2 - box.top;
      const t = WORDS[ids[i]].s[0][1];
      $('#attnsvg').insertAdjacentHTML('beforeend', `<path d="M${x1},${y1} C${(x1 + x2) / 2},${y1} ${(x1 + x2) / 2},${y2} ${x2},${y2}" stroke="var(--t${t})" stroke-width="3" fill="none" opacity=".85"/>`);
    }
    function trySel(side, i) {
      if (side === 'q' && matched.has(i)) return;
      if (side === 'k' && [...matched].some(q => keys.indexOf(ids[q]) === i)) return;
      if (!sel || sel.side === side) {
        sel = { side, i };
        qs.forEach((b, x) => b.classList.toggle('sel', side === 'q' && x === i));
        ks.forEach((b, x) => b.classList.toggle('sel', side === 'k' && x === i));
        if (side === 'q') TTS.speak(WORDS[ids[i]].h);
        return;
      }
      const qi = side === 'q' ? i : sel.i, kj = side === 'k' ? i : sel.i;
      sel = null; qs.forEach(b => b.classList.remove('sel')); ks.forEach(b => b.classList.remove('sel'));
      if (keys[kj] === ids[qi]) {
        A[qi][kj] += 3; matched.add(qi); pairs++;
        qs[qi].classList.add('done'); ks[kj].classList.add('done');
        line(qi, kj); SFX.good();
        if (side === 'k') TTS.speak(WORDS[ids[qi]].h);
        if (matched.size === ids.length) setTimeout(endRound, 450);
      } else {
        A[qi][kj] += 1; mistakes++; SFX.bad();
        [qs[qi], ks[kj]].forEach(b => { b.classList.remove('err'); void b.offsetWidth; b.classList.add('err'); });
      }
    }
    qs.forEach((b, i) => b.addEventListener('click', () => trySel('q', i)));
    ks.forEach((b, j) => b.addEventListener('click', () => trySel('k', j)));
    KEYH = e => {
      if (/^[1-5]$/.test(e.key)) { trySel('q', +e.key - 1); return true; }
      if (/^[6-90]$/.test(e.key)) { trySel('k', (+e.key + 4) % 10); return true; }
      return false;
    };
    function endRound() {
      // reorder columns so that the ideal attention pattern is diagonal
      const order = ids.map(id => keys.indexOf(id));
      heatmaps.push({ head, ids, M: A.map(row => { const r = order.map(j => row[j]); const s = r.reduce((a, b) => a + b, 0) || 1; return r.map(v => v / s); }) });
      round++;
      if (round < heads.length) play(); else finish();
    }
  }
  function finish() {
    const secs = (Date.now() - t0) / 1000;
    const xp = Math.max(5, Math.round(pairs * 3 - mistakes * 2 + Math.max(0, 20 - secs / 6)));
    el.innerHTML = `<div class="explain">Your attention weights, row-normalized. A perfect head puts all weight on the diagonal: each query attends to exactly one key. Off-diagonal mass = confusion.</div>
      <div class="row" style="justify-content:center;gap:40px">${heatmaps.map(h => `<div><div class="mode">${h.head} head</div>
        <div class="heat" style="grid-template-columns:repeat(${h.ids.length + 1},34px)"><div class="lab"></div>${h.ids.map(id => `<div class="lab">${esc(WORDS[id].h[0])}</div>`).join('')}
        ${h.M.map((row, i) => `<div class="lab">${esc(WORDS[h.ids[i]].h[0])}</div>${row.map((v, j) => `<div style="background:color-mix(in srgb, ${i === j ? 'var(--jade)' : 'var(--bad)'} ${Math.round(v * 100)}%, var(--card2))">${v > 0 ? v.toFixed(1) : ''}</div>`).join('')}`).join('')}</div></div>`).join('')}</div>
      <p class="muted" style="text-align:center;font-size:13px">softmax(QKᵀ/√d) does this for every token pair, in every head, in every layer.</p>`;
    KEYH = null;
    done({ xp, score: Math.round(100 * pairs / (pairs + mistakes)), summary: `${pairs} pairs · ${mistakes} mistakes · ${Math.round(secs)}s` });
  }
  play();
}

/* ---------- 2. Tokenizer ---------- */
function gameTokenizer(el, done) {
  const pool = playableSents(2, 20);
  const sents = shuffle(pool).sort((a, b) => sentText(b).length - sentText(a).length).slice(0, Math.min(6, pool.length));
  const chosen = shuffle(sents).slice(0, Math.min(3, sents.length));
  let idx = 0, xp = 0, f1sum = 0;
  function play() {
    const s = chosen[idx];
    const chars = []; // {c, tok, punct}
    s.z.forEach((t, ti) => [...t].forEach(c => chars.push({ c, tok: ti, punct: s.w[ti] < 0 })));
    const gaps = [];  // between chars[i] and chars[i+1]
    for (let i = 0; i < chars.length - 1; i++) {
      const fixed = chars[i].punct || chars[i + 1].punct;
      gaps.push({ gold: chars[i].tok !== chars[i + 1].tok, on: false, fixed });
    }
    const clickable = gaps.map((g, i) => g.fixed ? -1 : i).filter(i => i >= 0);
    let cur = 0, submitted = false;
    function render() {
      el.innerHTML = `<div class="explain">Sentence ${idx + 1}/${chosen.length}. Chinese is written without spaces, so splitting it into words is the first job of any NLP pipeline. Click between characters to place <b>token boundaries</b>. <kbd>←</kbd><kbd>→</kbd> move, <kbd>Space</kbd> toggle, <kbd>Enter</kbd> submit.</div>
        <div class="seg">${chars.map((ch, i) => `<span class="ch ${ch.punct ? 'muted' : ''}">${esc(ch.c)}</span>${i < gaps.length ? `<span class="gap ${gapCls(i)}" data-gap="${i}"></span>` : ''}`).join('')}</div>
        <div id="segres"></div>
        ${submitted ? '' : '<div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-say="' + esc(sentText(s)) + '">🔊 Hear it</button><button class="btn primary" id="segsub">Submit tokens</button></div>'}`;
      bindCommon(el);
      $$('[data-gap]', el).forEach(g => g.addEventListener('click', () => toggle(+g.dataset.gap)));
      $('#segsub') && $('#segsub').addEventListener('click', submit);
    }
    function gapCls(i) {
      const g = gaps[i];
      if (g.fixed) return 'fixed';
      if (submitted) return g.gold && g.on ? 'ok' : g.gold ? 'miss' : g.on ? 'extra' : '';
      return (g.on ? 'on ' : '') + (clickable[cur] === i ? 'cur' : '');
    }
    function toggle(i) { if (submitted || gaps[i].fixed) return; gaps[i].on = !gaps[i].on; cur = clickable.indexOf(i); SFX.tick(); render(); }
    function submit() {
      if (submitted) return;
      submitted = true;
      let tp = 0, fp = 0, fn = 0;
      gaps.forEach(g => { if (g.fixed) return; if (g.gold && g.on) tp++; else if (g.on) fp++; else if (g.gold) fn++; });
      const prec = tp + fp ? tp / (tp + fp) : 1, rec = tp + fn ? tp / (tp + fn) : 1;
      const f1 = prec + rec ? 2 * prec * rec / (prec + rec) : 0;
      f1sum += f1;
      const gained = Math.round(10 * f1) + (f1 === 1 ? 4 : 0); xp += gained;
      f1 === 1 ? SFX.good() : SFX.bad();
      render();
      const nUser = gaps.filter(g => !g.fixed && g.on).length + 1, nGold = s.w.filter(w => w >= 0).length;

/* ---------- 3. Quantize (tones) ---------- */
const CONTOUR = { 1: [[0, 5], [1, 5]], 2: [[0, 3], [1, 5]], 3: [[0, 2.2], [0.5, 1], [1, 4]], 4: [[0, 5], [1, 1]], 5: [[0.3, 3], [0.7, 2.6]] };
function contourSVG(syls, guesses) {
  const W = 520, H = 130, pad = 18, n = syls.length, sw = (W - pad * 2) / n;
  const y = v => H - 14 - (v - 1) / 4 * (H - 34);
  let svg = [1, 2, 3, 4, 5].map(l => `<line x1="${pad}" x2="${W - pad}" y1="${y(l)}" y2="${y(l)}" stroke="var(--line)" stroke-dasharray="2 5"/><text x="2" y="${y(l) + 3}" font-size="9" fill="var(--faint)" font-family="monospace">${l}</text>`).join('');
  syls.forEach(([syl, t], i) => {
    const x0 = pad + i * sw + 10, x1 = pad + (i + 1) * sw - 10;
    const pts = CONTOUR[t].map(([u, v]) => [x0 + u * (x1 - x0), y(v)]);
    // quadratic Bézier that passes through the middle point at t = 0.5 (the dip of tone 3)
    const d = pts.length === 3 ? `M${pts[0]} Q${2 * pts[1][0] - (pts[0][0] + pts[2][0]) / 2},${2 * pts[1][1] - (pts[0][1] + pts[2][1]) / 2} ${pts[2]}` : `M${pts[0]} L${pts[1]}`;
    svg += `<path d="${d}" stroke="var(--t${t})" stroke-width="5" fill="none" stroke-linecap="round"/>`;
    // quantized dots: the level each contour point snaps to
    svg += CONTOUR[t].map(([u, v]) => `<circle cx="${x0 + u * (x1 - x0)}" cy="${y(Math.round(v))}" r="3.5" fill="var(--text)" opacity=".6"/>`).join('');
    svg += `<text x="${(x0 + x1) / 2}" y="${H - 1}" text-anchor="middle" font-size="12" fill="var(--t${t})">${esc(syl)} · ${t === 5 ? 'neutral' : 'tone ' + t}</text>`;
  });
  return `<svg class="contour" viewBox="0 0 ${W} ${H}">${svg}</svg>`;
}
function gameQuantize(el, done) {
  const hasTTS = TTS.available();
  const pool = seenIds().filter(id => !isSusp(id));
  const multi = shuffle(pool.filter(id => WORDS[id].s.length > 1)), single = shuffle(pool.filter(id => WORDS[id].s.length === 1));
  const wantMulti = S.quantBits < 16 ? 5 : 3;
  const items = shuffle([...multi.slice(0, wantMulti), ...single].slice(0, 8).concat(multi.slice(wantMulti)).slice(0, 8));
  let idx = 0, xp = 0, streak = 0, correctN = 0;
  if (!hasTTS) S.quantBits = 16;
  function play() {
    const w = WORDS[items[idx]];
    const bits = S.quantBits;
    const guesses = w.s.map(() => 0);
    let submitted = false, played = 0;
    const bases = w.s.map(([syl]) => plainSyl(syl)[0].replace(/v/g, 'ü'));
    function render() {
      el.innerHTML = `<div class="qbits">${[16, 8, 4].map(b => `<span class="${b === bits ? 'on' : ''}">${b === 16 ? 'FP16' : 'INT' + b}</span>`).join('')}</div>
        <div class="explain">Word ${idx + 1}/${items.length}. Pitch is continuous; Mandarin <b>quantizes</b> it into 4 tones + neutral. ${bits === 16 ? 'FP16: characters, pinyin and audio.' : bits === 8 ? 'INT8: no characters. Audio + letters only.' : 'INT4: audio plays once. Max compression, ×2 XP.'} Streak of 4 lowers the bit-width; a miss raises it. Type tones with <kbd>1</kbd>–<kbd>5</kbd>.</div>
        <div style="text-align:center">
          ${bits === 16 || !hasTTS ? `<div class="hz md">${esc(w.h)}</div>` : ''}
          ${hasTTS ? `<button class="speak ${bits === 16 ? '' : 'huge'}" id="qplay">${ICON_SPEAK}</button>` : ''}
          <div class="sylrow">${bases.map((b, i) => `<div class="sylbox"><span class="base">${esc(b)}</span><div class="tonebtns">${[1, 2, 3, 4, 5].map(t => `<button data-s="${i}" data-t="${t}" class="${tbCls(i, t)}">${t === 5 ? '·' : t}</button>`).join('')}</div></div>`).join('')}</div>
          <div id="qres"></div>
        </div>`;
      $$('[data-t]', el).forEach(b => b.addEventListener('click', () => setTone(+b.dataset.s, +b.dataset.t)));
      const p = $('#qplay'); if (p) p.addEventListener('click', playAudio);
    }
    function tbCls(i, t) {
      if (!submitted) return guesses[i] === t ? 'on' : '';
      const want = w.s[i][1];
      if (t === want) return 'ok';
      if (t === guesses[i]) return 'bad';

    }
    function playAudio() { if (bits === 4 && played >= 1 && !submitted) return; played++; TTS.speak(w.h, S.settings.rate * 0.9); }
    function setTone(i, t) { if (submitted) return; guesses[i] = t; render(); if (guesses.every(g => g)) setTimeout(submit, 250); }
    function okAt(i) {
      const want = w.s[i][1], g = guesses[i];

      if (g === want) return true;

      return false;
    }

      if (submitted) return;

      const ok = w.s.every((_, i) => okAt(i));
      const mult = bits === 16 ? 1 : bits === 8 ? 1.5 : 2;
      let note = '';
      if (ok) { correctN++; streak++; xp += Math.round(4 * mult); SFX.good(); if (streak >= 4 && S.quantBits > 4) { S.quantBits /= 2; streak = 0; note = `<span class="pill accent">quantized to INT${S.quantBits}!</span>`; } }
      else { streak = 0; SFX.bad(); if (S.quantBits < 16) { S.quantBits *= 2; note = `<span class="pill">precision restored to ${S.quantBits === 16 ? 'FP16' : 'INT' + S.quantBits}</span>`; } }
      render();
      const sandhi = w.s.some((x, i) => x[1] === 3 && w.s[i + 1] && w.s[i + 1][1] === 3);
      const topHz = $('.gamecard .hz'); if (topHz) topHz.innerHTML = hanziHTML(w);
      $('#qres').innerHTML = `<div class="reveal">${topHz ? '' : `<div class="hz md">${hanziHTML(w)}</div>`}<div class="py">${pinyinHTML(w.s)}</div><div class="muted">${esc(w.m)}</div>
        ${contourSVG(w.s, guesses)}
        <div class="row" style="justify-content:center;margin-top:6px"><span class="pill ${ok ? 'jade' : 'gold'}">${ok ? 'correct' : 'quantization error'}</span>${note}${sandhi ? '<span class="pill gold">3-3 sandhi: first 3rd tone sounds like 2nd</span>' : ''}</div>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="qnext">${idx + 1 < items.length ? 'Next' : 'Finish'} <kbd style="color:inherit;background:transparent;border-color:rgba(255,255,255,.4)">Enter</kbd></button></div></div>`;
      $('#qnext').addEventListener('click', next);
      TTS.speak(w.h);
    }
    function next() { idx++; if (idx < items.length) play(); else end(); }
    render();
    if (hasTTS) setTimeout(playAudio, 250);
    KEYH = e => {
      if (submitted) { if (e.key === 'Enter' || e.key === ' ') { next(); return true; } return false; }
      if (/^[1-5]$/.test(e.key)) { const i = guesses.findIndex(g => !g); if (i >= 0) setTone(i, +e.key); return true; }
      if (e.key === 'Backspace') { for (let i = guesses.length - 1; i >= 0; i--) if (guesses[i]) { guesses[i] = 0; break; } render(); return true; }
      if (e.key === 'r' || e.key === 'R') { playAudio(); return true; }
      if (e.key === 'Enter' && guesses.every(g => g)) { submit(); return true; }
      return false;
    };
  }
  function end() {
    KEYH = null; save();
    el.innerHTML = `<div class="explain">Real quantization works the same way: map a continuous value to the nearest of a few levels with a scale factor, q = round(x/s). Fewer levels → smaller model, more rounding error. GPTQ and AWQ are clever ways to decide <i>where</i> that error can go.</div>`;
    done({ xp: Math.max(3, xp), score: Math.round(100 * correctN / items.length), summary: `${correctN}/${items.length} correct · now at ${S.quantBits === 16 ? 'FP16' : 'INT' + S.quantBits}` });

}

/* ---------- 4. Decoder ---------- */
function gameDecoder(el, done) {
  const pool = playableSents(3, 22);
  const chosen = shuffle(pool).slice(0, Math.min(4, pool.length));
  let idx = 0, xp = 0, totalErr = 0, nllSum = 0, tokSum = 0;
  function play() {
    const s = chosen[idx];
    const gold = s.z.map((t, i) => ({ t, w: s.w[i] })).filter(x => x.w >= 0);
    const inSent = new Set(gold.map(g => g.w));
    const nd = gold.length <= 3 ? 1 : 2;
    const dist = pickDistinct(seenIds().filter(id => !inSent.has(id) && !gold.some(g => g.t === WORDS[id].h)), nd);
    const tiles = shuffle([...gold.map((g, i) => ({ t: g.t, w: g.w, gi: i })), ...dist.map(id => ({ t: WORDS[id].h, w: id, gi: -1 }))]);
    let pos = 0, nll = 0, errs = 0, hint = false;
    const used = new Set();
    function outHTML() {
      // generated tokens so far; punctuation appears once every word before it is generated
      let html = '', gi = 0;
      for (let i = 0; i < s.z.length; i++) {
        if (s.w[i] < 0) { if (gi > 0 && gi <= pos) html += `<span class="tokd" style="background:none;color:var(--muted)">${esc(s.z[i])}</span>`; continue; }
        if (gi < pos) html += `<span class="tokd">${esc(s.z[i])}</span>`;
        gi++;
      }
      return html + (pos < gold.length ? '<span class="cursor"></span>' : '');
    }
    function render() {
      el.innerHTML = `<div class="explain">Sentence ${idx + 1}/${chosen.length}. You are the decoder: generate the translation <b>autoregressively</b>, one token at a time, left to right. A correct token costs −log 0.9 ≈ 0.11 nats; a wrong one costs −log 0.05 ≈ 3.0. <kbd>1</kbd>–<kbd>9</kbd> pick, <kbd>R</kbd> audio hint (+0.5).</div>
        <div class="prompt-en" style="text-align:center;margin:12px 0 4px">${esc(s.en)}</div>
        <div class="decout" id="decout">${outHTML()}</div>
        <div class="tiles">${tiles.map((t, i) => `<button class="tile ${used.has(i) ? 'used' : ''}" data-ti="${i}"><span class="k">${i + 1}</span>${esc(t.t)}</button>`).join('')}</div>
        <div class="row" style="justify-content:center;margin-top:12px"><span class="nll">NLL ${nll.toFixed(2)} · step ${pos}/${gold.length}</span></div>
        <div id="decres"></div>`;
      $$('[data-ti]', el).forEach(b => b.addEventListener('click', () => choose(+b.dataset.ti)));
    }
    function choose(i) {
      if (pos >= gold.length || used.has(i)) return;
      const t = tiles[i];
      if (t.t === gold[pos].t) {
        used.add(i); pos++; nll += -Math.log(0.9); SFX.tick();
        render();
        if (pos === gold.length) finishSent();
      } else {
        const later = gold.slice(pos + 1).some(g => g.t === t.t);
        nll += later ? -Math.log(0.2) : -Math.log(0.05); errs++; SFX.bad();
        render();
        const b = $(`[data-ti="${i}"]`, el); b.classList.add('err');
        if (later) toast('Right token, wrong position: order matters (RoPE!)');
      }
    }
    function finishSent() {
      const ppl = Math.exp(nll / gold.length);
      nllSum += nll; tokSum += gold.length; totalErr += errs;
      const gained = Math.max(2, 12 - 3 * errs); xp += gained;
      $('#decres').innerHTML = `<div class="reveal">${sentenceHTML(s)}<div class="row" style="justify-content:center;margin-top:8px"><span class="pill ${errs ? 'gold' : 'jade'}">perplexity ${ppl.toFixed(2)}</span><span class="pill">${errs} wrong token${errs === 1 ? '' : 's'}</span></div>
        <div class="row" style="justify-content:center;margin-top:12px"><button class="btn primary" id="decnext">${idx + 1 < chosen.length ? 'Next sentence' : 'Finish'} <kbd style="color:inherit;background:transparent;border-color:rgba(255,255,255,.4)">Enter</kbd></button></div></div>`;
      bindCommon($('#decres'));
      $('#decnext').addEventListener('click', next);
      errs ? SFX.bad() : SFX.good();
      TTS.speak(sentText(s));
    }
    function next() { idx++; if (idx < chosen.length) play(); else end(); }
    render();
    KEYH = e => {
      if (pos >= gold.length) { if (e.key === 'Enter' || e.key === ' ') { next(); return true; } return false; }
      if (/^[1-9]$/.test(e.key)) { choose(+e.key - 1); return true; }
      if (e.key === 'r' || e.key === 'R') { if (!hint) { hint = true; nll += 0.5; render(); } TTS.speak(sentText(s)); return true; }
      return false;
    };
  }
  function end() {
    KEYH = null;
    const ppl = Math.exp(nllSum / Math.max(1, tokSum));
    el.innerHTML = `<div class="explain">That's exactly how an LLM writes: one token at a time, each conditioned on everything before it. Greedy decoding = always take the most likely next token. It's fast, but a locally good choice can lead to a globally worse sentence. That's what <b>beam search</b> fixes.</div>`;
    done({ xp: Math.max(4, xp), score: Math.round(100 / ppl), summary: `perplexity ${ppl.toFixed(2)} · ${totalErr} wrong tokens` });
  }
  play();
}

/* ============================================================
   Chengyu (成语): rare FSRS idiom cards + the "Idiom" mini-game (masked LM by hand)
   ============================================================ */

const IDIOMS = (DATA.idioms || []).map(([h, s, lit, m, story, tag, ai], id) => ({ id, h, s, lit, m, story, tag, ai }));
const IDIOM_BY_KEY = Object.fromEntries(IDIOMS.map(x => [x.h, x]));
const IDIOM_MIN_VOCAB = 40;          // idiom cards start once the basics are in place

/* ---------- scheduling ---------- */
function ensureICard(key) { return S.icards[key] || (S.icards[key] = { st: 0, s: 0, d: 0, due: 0, last: 0, reps: 0, lapses: 0 }); }
const isIdiomSeen = key => { const c = S.icards[key]; return !!(c && c.st > 0); };
function idiomSeenCount() { return Object.values(S.icards).filter(c => c.st > 0).length; }
function dueIdiomKeys(di = today()) {
  return Object.keys(S.icards).filter(k => { const c = S.icards[k]; return IDIOM_BY_KEY[k] && c.st > 0 && !c.susp && c.due <= di; })
    .sort((a, b) => S.icards[a].due - S.icards[b].due);
}
function newIdiomKeys(limit) {
  if (limit <= 0 || seenIds().length < IDIOM_MIN_VOCAB) return [];
  const order = [...(S.iorder || []), ...IDIOMS.map(x => x.h)];
  const out = [];
  for (const k of order) { if (out.length >= limit) break; if (IDIOM_BY_KEY[k] && !isIdiomSeen(k) && !out.includes(k) && !(S.icards[k] && S.icards[k].susp)) out.push(k); }
  return out;
}

function lastIdiomIntroDay() {
  let m = -1e9;
  for (const c of Object.values(S.icards)) { const t = c.first || (c.st > 0 ? c.last : 0); if (t) m = Math.max(m, dayIndex(t)); }
  return m;
}
function newIdiomLeftToday() {
  const every = +S.settings.idiomEvery || 0;
  if (!every || (dayStats().iNew || 0) > 0 || catchUpFactor() < 1) return 0;
  return today() - lastIdiomIntroDay() >= every ? 1 : 0;
}
function mixIdioms(main, idue, inew) {
  const out = main.slice();
  const put = (it, frac) => out.splice(Math.min(out.length, Math.max(1, Math.round(out.length * frac))), 0, it);
  idue.forEach((it, k) => put(it, (k + 1) / (idue.length + 1)));
  inew.forEach((it, k) => put(it, 0.35 + 0.3 * (k + 1) / (inew.length + 1)));
  return out;
}

const IMODE_LABEL = { mean: ['meaning', '意思 yìsi'], fill: ['fill the [MASK]', '填空 tiánkòng'], recall: ['recall', '回忆 huíyì'], hear: ['listen · no characters', '听 tīng'] };

GAMES.idiom = {

function gameIdiom(el, done) {

        prompt = idiomCharsHTML(x);
      }
      el.innerHTML = `${head}<div style="text-align:center">${prompt}</div><div class="opts">${opts.map(optHTML).join('')}</div><div id="idres"></div>`;
      const choose = i => {

        $$('.opt', el).forEach((b, j) => { b.disabled = true; b.classList.add(opts[j].right ? 'right' : j === i ? 'wrong' : 'dim'); });

      KEYH = e => {

        if (/^[1-4]$/.test(e.key)) { choose(+e.key - 1); return true; }

/* ============================================================
   Sentence training: FSRS sentence cards inside epochs + Sentence Gym
   Modes: build (tiles / IME typing), translate, listen (no characters),
          dictation (no characters), listen & translate (no characters)
   ============================================================ */

const SMODE_LABEL = {
  build: ['build', '造句 zàojù'],
  trans: ['translate', '翻译 fānyì'],
  listen: ['listen · no characters', '听力 tīnglì'],
  dict: ['dictation · no characters', '听写 tīngxiě'],
  ltrans: ['listen & translate · no characters', '听译 tīngyì'],
};
const AUDIO_MODES = ['listen', 'dict', 'ltrans'];
const isHanChar = c => /[\u4e00-\u9fff]/.test(c);

function chooseSentMode(item) {
  const tts = TTS.available();
  if (item.forceMode) return (!tts && AUDIO_MODES.includes(item.forceMode)) ? 'trans' : item.forceMode;
  const c = S.scards[item.key];
  const s = c && c.st ? c.s : 0;
  let w;
  if (item.first || !c || !c.st) w = { trans: .45, build: .4, listen: .15 };
  else if (item.kind === 'slearn') w = { build: .4, listen: .35, dict: .25 };
  else if (s < 4) w = { build: .35, trans: .25, listen: .25, dict: .15 };
  else if (s < 15) w = { trans: .25, dict: .3, listen: .2, build: .15, ltrans: .1 };
  else w = { ltrans: .35, dict: .3, trans: .15, build: .2 };
  if (!tts) AUDIO_MODES.forEach(m => delete w[m]);
  if (c && c.lm && w[c.lm] && Object.keys(w).length > 1) w[c.lm] *= 0.3;   // vary the drill
  const keys = Object.keys(w), tot = keys.reduce((a, k) => a + w[k], 0);
  return keys[sample(keys.map(k => w[k] / tot))];
}

/* ---------- answer checking (LCS alignment) ---------- */
function lcsAlign(U, T) {
  const n = U.length, m = T.length;
  const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
  for (let i = 1; i <= n; i++) for (let j = 1; j <= m; j++)
    dp[i][j] = U[i - 1] === T[j - 1] ? dp[i - 1][j - 1] + 1 : Math.max(dp[i - 1][j], dp[i][j - 1]);
  const tMatched = new Array(m).fill(false);
  let i = n, j = m;
  while (i > 0 && j > 0) {
    if (U[i - 1] === T[j - 1]) { tMatched[j - 1] = true; i--; j--; }
    else if (dp[i - 1][j] >= dp[i][j - 1]) i--; else j--;
  }
  return { len: dp[n][m], tMatched };
}
/** compare typed input (Chinese characters or pinyin) with a sentence */
function checkSentenceInput(input, s) {
  const raw = input.trim();
  const toks = s.z.map((t, i) => ({ t, i, w: s.w[i] })).filter(x => x.w >= 0);
  const T = [], tokOf = [];
  let kind, U, hasTone = false;
  if ([...raw].some(isHanChar)) {
    kind = 'hanzi';
    U = [...raw].filter(isHanChar);
    toks.forEach(x => [...x.t].forEach(c => { T.push(c); tokOf.push(x.i); }));
  } else {
    kind = 'pinyin';
    U = [];
    for (const ch of raw.toLowerCase().replace(/u:/g, 'v').replace(/ü/g, 'v')) {
      if (MARK_TO[ch]) { U.push(MARK_TO[ch][0]); hasTone = true; }
      else if (/[0-5]/.test(ch)) hasTone = true;
      else if (/[a-z]/.test(ch)) U.push(ch);
    }
    toks.forEach(x => s.s[x.i].forEach(([syl]) => [...plainSyl(syl)[0]].forEach(c => { T.push(c); tokOf.push(x.i); })));
  }
  const { len, tMatched } = lcsAlign(U, T);
  const ratio = U.length + T.length ? 2 * len / (U.length + T.length) : 0;
  const tokOk = {};
  toks.forEach(x => { tokOk[x.i] = true; });
  tMatched.forEach((ok, k) => { if (!ok) tokOk[tokOf[k]] = false; });
  let tones = null;
  if (kind === 'pinyin') {
    if (!hasTone) tones = 'none';
    else if (ratio === 1) tones = checkPinyin(raw, { s: toks.flatMap(x => s.s[x.i]) }) === 'ok' ? 'ok' : 'off';
  }
  return { kind, ratio, tokOk, tones };
}
function suggestionFromCheck(r) {
  if (r.ratio === 1) return r.tones === 'off' ? 2 : 3;
  return r.ratio >= 0.8 ? 2 : 1;
}
function checkVerdict(r) {
  const pct = Math.round(r.ratio * 100);
  if (r.ratio === 1) {
    if (r.kind === 'hanzi') return ['ok', 'Perfect! 完全正确'];
    if (r.tones === 'ok') return ['ok', 'Perfect, tones included!'];
    if (r.tones === 'off') return ['meh', 'Letters right, some tones off'];
    return ['ok', 'Correct! (add tone numbers next time for the full workout)'];
  }
  return r.ratio >= 0.8 ? ['meh', `Almost: ${pct}% match`] : ['bad', `${pct}% match. Compare below`];
}

/* ---------- listen options ---------- */
function listenOptions(s) {
  const len = s.z.length;
  const pool = SENTS.filter(x => x.key !== s.key && x.en !== s.en && Math.abs(x.z.length - len) <= 3);
  const known = pool.filter(sentEligible);
  const src = known.length >= 6 ? known : pool;
  return shuffle([s, ...shuffle(src).slice(0, 3)]);
}

      <input class="typein wide" id="ein" lang="en" placeholder="your translation (optional), Enter to check" autocomplete="off">
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn small ghost" id="hintbtn">Show pinyin</button><button class="btn small" id="revbtn">Reveal <kbd>Enter</kbd></button></div>`;
  } else if (mode === 'listen') {
    opts = listenOptions(s);
    body = `${audioButtons(txt)}<div class="muted" style="margin-top:6px">What does it mean?</div>
      <div class="opts one">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span>${esc(o.en)}</span></button>`).join('')}</div>`;
  } else if (mode === 'dict') {
    body = `${audioButtons(txt)}<input class="typein wide han-in" id="sin" lang="zh-CN" placeholder="type what you hear: pinyin (tones optional) or Chinese" autocomplete="off" autocapitalize="off" spellcheck="false">
      <div class="faint" style="font-size:12px;margin-top:6px">Enter on an empty box replays · Shift+Enter plays slowly</div><div class="verdict" id="verdict"></div>`;
  } else if (mode === 'ltrans') {
    body = `${audioButtons(txt)}<div class="muted" style="margin-top:6px">Translate what you hear</div>
      <input class="typein wide" id="ein" lang="en" placeholder="your translation (optional), Enter to reveal" autocomplete="off">
      <div class="row" style="justify-content:center;margin-top:10px"><button class="btn small" id="revbtn">Reveal <kbd>Enter</kbd></button></div>`;
  }
  const hints = {
    build: S.settings.sentInput === 'type' ? '<span><kbd>Enter</kbd> check</span>' : '<span><kbd>1</kbd>–<kbd>9</kbd> pick tiles</span><span><kbd>R</kbd> audio hint</span>',
    trans: '<span><kbd>Enter</kbd> reveal</span>',
    listen: '<span><kbd>1</kbd>–<kbd>4</kbd> answer</span><span><kbd>R</kbd> replay</span><span><kbd>S</kbd> slow</span>',
    dict: '<span><kbd>Enter</kbd> check · empty <kbd>Enter</kbd> replays · <kbd>Shift</kbd>+<kbd>Enter</kbd> slow</span>',
    ltrans: '<span><kbd>Enter</kbd> reveal</span><span>🔊 / 🐢 buttons replay</span>',
  }[mode];
  stage.innerHTML = `<div class="card qcard pop">${head}${body}<div id="reveal"></div></div><div class="grades hidden" id="grades"></div>
    <div class="hint" id="qhint">${hints}<span><kbd>Esc</kbd> end</span></div>`;
  bindCommon(stage);
  const say = slow => TTS.speak(txt, slow ? S.settings.rate * 0.6 : undefined);
  if (AUDIO_MODES.includes(mode)) setTimeout(() => say(false), 250);
  const focusIn = $('#sin') || $('#ein'); if (focusIn) setTimeout(() => focusIn.focus(), 40);

  /* -- reveal + grading -- */
  function reveal(sug, msgHTML = '') {
    if (st.answered) return;
    st.answered = true; st.sug = sug; st.lock = Date.now() + 300;
    if (sug >= 3) SFX.good(); else if (sug === 1) SFX.bad();
    $$('input', stage).forEach(i => i.disabled = true);
    ['#tiles', '#swapin', '#hintbtn', '#revbtn'].forEach(sel => { const el = $(sel, stage); if (el) el.style.display = 'none'; });
    const r = $('#reveal');
    r.innerHTML = `<div class="reveal">${msgHTML}${msgHTML.includes('class="sent"') ? '' : sentenceHTML(s)}
      <div class="en-big">${esc(s.en)}</div>${audioButtons(txt, false)}${glossHTML(s, unknown)}
      <div class="memline">${SESS.practice ? 'practice: your schedule is not changed' : sentMemLine(item.key)}</div></div>`;
    bindCommon(r);
    if (S.settings.autoplay && !AUDIO_MODES.includes(mode)) say(false);
    renderGrades();
    $('#qhint').innerHTML = '<span><kbd>Space</kbd> accept suggestion</span><span><kbd>1</kbd> Again <kbd>2</kbd> Hard <kbd>3</kbd> Good <kbd>4</kbd> Easy</span><span><kbd>R</kbd> audio</span>';
  }
  function renderGrades() {
    const g = $('#grades'); g.classList.remove('hidden');
    const iv = SESS.practice ? null : previewFor(S.scards[item.key]);
    g.innerHTML = ['Again', 'Hard', 'Good', 'Easy'].map((n, i) => `<button class="grade g${i + 1} ${st.sug === i + 1 ? 'sug' : ''}" data-g="${i + 1}">
      <span class="gn">${n}</span><span class="gi">${iv ? (i === 0 ? 'relearn' : fmtIvl(iv[i])) : 'practice'}</span><span class="gk">${i + 1}</span></button>`).join('');
    $$('.grade', g).forEach(b => b.addEventListener('click', () => grade(+b.dataset.g)));
  }
  function grade(g) { if (!st.answered || Date.now() < st.lock) return; finishSentence(item, g, mode); }

  /* -- mode wiring -- */
  let tilesKey = null;
  if (mode === 'build' && S.settings.sentInput !== 'type') tilesKey = setupTiles();
  function setupTiles() {
    const gold = s.z.map((t, i) => ({ t, w: s.w[i] })).filter(x => x.w >= 0);
    const inSent = new Set(gold.map(g => g.w));
    const dist = pickDistinct(seenIds().filter(id => !inSent.has(id) && !gold.some(g => g.t === WORDS[id].h) && WORDS[id].l > 0), gold.length <= 3 ? 1 : 2);
    const tiles = shuffle([...gold.map(g => ({ t: g.t })), ...dist.map(id => ({ t: WORDS[id].h }))]);
    const used = new Set();
    let pos = 0, errs = 0;
    function draw() {
      let html = '', gi = 0;
      for (let i = 0; i < s.z.length; i++) {
        if (s.w[i] < 0) { if (gi > 0 && gi <= pos) html += `<span class="tokd" style="background:none;color:var(--muted)">${esc(s.z[i])}</span>`; continue; }
        if (gi < pos) html += `<span class="tokd">${esc(s.z[i])}</span>`;
        gi++;
      }
      $('#decout').innerHTML = html + (pos < gold.length ? '<span class="cursor"></span>' : '');
      $('#tiles').innerHTML = tiles.map((t, i) => `<button class="tile ${used.has(i) ? 'used' : ''}" data-ti="${i}"><span class="k">${i + 1}</span>${esc(t.t)}</button>`).join('');
      $$('[data-ti]', stage).forEach(b => b.addEventListener('click', () => choose(+b.dataset.ti)));
    }
    function choose(i) {
      if (st.answered || pos >= gold.length || used.has(i)) return;
      if (tiles[i].t === gold[pos].t) {
        used.add(i); pos++; SFX.tick(); draw();
        if (pos === gold.length) {
          const sug = errs === 0 && !st.hint ? 3 : errs <= 1 ? 2 : 1;
          reveal(sug, `<div class="verdict ${errs ? (errs > 1 ? 'bad' : 'meh') : 'ok'}">${errs ? `${errs} wrong pick${errs > 1 ? 's' : ''}` : 'Built it! 很好'}</div>`);
        }
      } else {
        errs++; SFX.bad();
        const b = $(`[data-ti="${i}"]`, stage); b.classList.remove('err'); void b.offsetWidth; b.classList.add('err');
      }
    }
    draw();
    return choose;
  }
  const sw = $('#swapin');
  if (sw) sw.addEventListener('click', () => { S.settings.sentInput = S.settings.sentInput === 'type' ? 'tiles' : 'type'; save(); showSentence(Object.assign({}, item, { forceMode: 'build' })); });

  function submitTyped() {
    const inp = $('#sin'); if (!inp || st.answered) return;
    const v = inp.value.trim();
    if (!v) { if (mode === 'dict') say(false); return; }
    const r = checkSentenceInput(v, s);
    const [cls, msg] = checkVerdict(r);
    inp.classList.add(cls === 'ok' ? 'ok' : cls === 'meh' ? 'meh' : 'bad');
    reveal(suggestionFromCheck(r), `<div class="verdict ${cls}">${esc(msg)}</div><div class="faint" style="font-size:12px">you typed: <span class="${r.kind === 'hanzi' ? 'han' : 'mono'}">${esc(v)}</span> · green = matched, red = missed</div>${diffHTML(s, r.tokOk)}`);
  }
  function revealTranslation() {
    if (st.answered) return;
    const e = $('#ein'), typed = e ? e.value.trim() : '';
    reveal(st.hint ? 2 : 3, typed ? `<div class="yours">your translation: <b>${esc(typed)}</b><div class="faint" style="font-size:12px">compare with the reference below, then rate yourself honestly</div></div>` : '');
  }
  const sin = $('#sin');
  if (sin) sin.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;                 // IME is composing: let it finish
    if (e.key === 'Enter') {
      e.preventDefault(); e.stopPropagation();
      if (st.answered) return grade(st.sug);
      if (e.shiftKey && mode === 'dict') return say(true);
      submitTyped();
    }
  });
  const ein = $('#ein');
  if (ein) ein.addEventListener('keydown', e => {
    if (e.isComposing || e.keyCode === 229) return;
    if (e.key === 'Enter') { e.preventDefault(); e.stopPropagation(); if (st.answered) grade(st.sug); else revealTranslation(); }
  });
  const showPinyin = () => { if (st.answered || st.hint) return; st.hint = true; $('#pyhint').innerHTML = sentPinyinHTML(s); };
  $('#hintbtn') && $('#hintbtn').addEventListener('click', showPinyin);
  $('#revbtn') && $('#revbtn').addEventListener('click', revealTranslation);
  function chooseOpt(i) {
    if (st.answered || !opts[i]) return;
    const right = opts[i].key === s.key;
    $$('.opt', stage).forEach((b, j) => { b.disabled = true; b.classList.add(opts[j].key === s.key ? 'right' : j === i ? 'wrong' : 'dim'); });
    reveal(right ? 3 : 1);
  }
  $$('.opt', stage).forEach(b => b.addEventListener('click', () => chooseOpt(+b.dataset.i)));

  KEYH = e => {
    const k = e.key, inInput = e.target && e.target.tagName === 'INPUT' && !e.target.disabled;
    if (k === 'Escape') { endEpoch(true); return true; }
    if (inInput) return false;
    if (k === 'r' || k === 'R') { if (mode === 'build' && !st.answered) st.hint = true; say(false); return true; }
    if ((k === 's' || k === 'S') && (AUDIO_MODES.includes(mode) || st.answered)) { say(true); return true; }
    if (st.answered) {
      if (/^[1-4]$/.test(k)) { grade(+k); return true; }
      if (k === ' ' || k === 'Enter') { grade(st.sug); return true; }
      return false;
    }
    if (mode === 'listen' && /^[1-4]$/.test(k)) { chooseOpt(+k - 1); return true; }
    if (tilesKey && /^[1-9]$/.test(k)) { tilesKey(+k - 1); return true; }
    if ((mode === 'trans' || mode === 'ltrans') && (k === ' ' || k === 'Enter')) { revealTranslation(); return true; }
    if (mode === 'trans' && (k === 'p' || k === 'P')) { showPinyin(); return true; }
    return false;
  };
}

function finishSentence(item, g, mode) {
  const key = item.key;
  SESS.done++;
  SESS.grades.push(g);
  (SESS.sents[key] = SESS.sents[key] || []).push(g);
  if (!SESS.practice) {
    const wasNew = !isSentSeen(key);
    applySentGrade(key, g);
    S.scards[key].lm = mode;
    const ds = dayStats();
    if (wasNew) { ds.sNew = (ds.sNew || 0) + 1; SESS.nSentNew++; }
    else if (item.kind === 'srev') ds.rev++;
    addXP([0, 3, 8, 14, 16][g], 'sentence');
    if (item.first && g < 4) SESS.learn.push({ key, kind: 'slearn', at: SESS.step + 6, tries: 1 });
    else if (item.kind === 'slearn' && g === 1 && item.tries < 3) SESS.learn.push({ key, kind: 'slearn', at: SESS.step + 5, tries: item.tries + 1 });
    else if (item.kind === 'srev' && g === 1) SESS.learn.push({ key, kind: 'slearn', at: SESS.step + 6, tries: 1 });
  } else {
    addXP([0, 2, 5, 8, 9][g], 'gym');
    if (g === 1 && !item.retry) SESS.main.splice(Math.min(3, SESS.main.length), 0, Object.assign({}, item, { retry: true, forceMode: item.forceMode }));
  }
  save();
  flushLevelUps(nextItem);
}

/* ---------- mixing sentence cards into an epoch ---------- */
function mixSentences(main, sdue, snew) {
  const out = main.slice();
  const insertSpread = (items, from) => {
    if (!items.length) return;
    const span = Math.max(1, out.length - from);
    items.forEach((it, k) => {
      const pos = Math.min(out.length, from + Math.round((k + 1) * span / (items.length + 1)) + k);
      out.splice(pos, 0, it);
    });
  };
  insertSpread(sdue, Math.min(3, out.length));
  insertSpread(snew, Math.floor(out.length / 2));
  return out;
}

/* ---------- Sentence Gym ---------- */
const GYM_MODES = [['mixed', 'Mixed', '混合'], ['build', 'Build', '造句'], ['trans', 'Translate', '翻译'], ['listen', 'Listen', '听力'], ['dict', 'Dictation', '听写'], ['ltrans', 'Listen & translate', '听译']];
function gymPool(stretch) {
  if (stretch) {
    const one = SENTS.filter(s => { const u = sentUnknown(s); return u.length === 1 && WORDS[u[0]].l > 0 && sentWordIds(s).length >= 3; });
    if (one.length >= 5) return one;
  }
  return SENTS.filter(s => sentEligible(s) && s.w.filter(w => w >= 0).length >= 2);
}
function gymModal() {
  const tts = TTS.available();

    <label style="display:flex;gap:10px;align-items:flex-start;cursor:pointer;margin:6px 0 4px"><input type="checkbox" id="gstretch" style="margin-top:4px;accent-color:var(--accent)"> <span><b>Stretch</b>: one unknown word per sentence, guess it from context (${stretchN} sentences)</span></label>
    <div class="row" style="margin-top:12px"><span class="muted">Sentences:</span>${[10, 20, 30].map(x => `<button class="btn small ${x === n ? 'primary' : ''}" data-n="${x}">${x}</button>`).join('')}<span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="gstart">Start <kbd style="color:inherit;background:transparent;border-color:rgba(255,255,255,.4)">Enter</kbd></button></div>`,
    null, { noEnter: true, keys: (e, close) => { if (e.key === 'Enter') { close(); startGym(mode, stretch, n); return true; } return false; } });
  $$('[data-m]', m.bg).forEach(b => b.addEventListener('click', () => { mode = b.dataset.m; $$('[data-m]', m.bg).forEach(x => x.classList.toggle('on', x === b)); }));
  $$('[data-n]', m.bg).forEach(b => b.addEventListener('click', () => { n = +b.dataset.n; $$('[data-n]', m.bg).forEach(x => x.classList.toggle('primary', x === b)); }));

function startGym(mode = 'mixed', stretch = false, n = 10) {
  if (SESS) endEpoch(true, true);
  const pool = gymPool(stretch);
  if (pool.length < 2) { toast('Learn a few more words first: sentences unlock once you know all their words.'); return; }
  // prefer sentences you haven't drilled much: unseen or weakly remembered first
  const score = s => { const c = S.scards[s.key]; return (c && c.st ? FSRS.retrievability(c) : 0.4) + Math.random() * 0.6; };
  const picks = pool.map(s => [score(s), s]).sort((a, b) => a[0] - b[0]).slice(0, n).map(x => x[1]);
  const items = shuffle(picks).map(s => ({ key: s.key, kind: 'gym', forceMode: mode === 'mixed' ? null : mode, stretch: stretch && sentUnknown(s).length > 0 }));
  SESS = {
    start: Date.now(), main: items, learn: [], step: 0, done: 0, grades: [], xp: 0, nNew: 0, nSentNew: 0, words: {}, sents: {},
    practice: true, gym: true, sinceGame: 0, nextGameAt: 99, lastGame: null, games: 0, epochNo: S.epochs.length + 1,
  };
  VIEW = 'session'; renderTop();
  $('#main').innerHTML = `<div class="sessbar" id="sessbar"></div><div class="stage" id="stage"></div>`;
  nextItem();
}

/* ============================================================
   Chat fine-tuning: dialogue cards (FSRS) + Chat gym, the Particles mini-game,
   usage notes for chat words (reactions, mood particles, fillers, slang, function words)
   ============================================================ */

const DLGS = (DATA.dlgs || []).map(([cat, turns], id) => {
  const t = turns.map(([w, z, s, en, spk]) => ({ w, z, s, en, spk, key: z.join('') }));
  return { id, cat, t, key: t.map(x => x.key).join('｜') };
});
const DLG_BY_KEY = Object.fromEntries(DLGS.map(d => [d.key, d]));
const DLGS_BY_WORD = {};
DLGS.forEach(d => new Set(d.t.flatMap(x => x.w.filter(w => w >= 0))).forEach(id => (DLGS_BY_WORD[id] = DLGS_BY_WORD[id] || []).push(d.id)));
const PARTICLE_GLOSS = { 吗: 'yes/no question', 吧: 'suggestion · "…right?"', 呢: '"and you?" · ongoing', 啊: 'feeling · warmth', 嘛: 'obviously · come on', 啦: 'cheerful 了 + 啊', 呀: 'soft 啊', 了: 'done · new situation' };
const PART_WRONG = { 啊: ['吗', '吧', '呢'], 吧: ['吗', '呢', '啊'], 呢: ['吗', '吧'], 吗: ['吧', '呢', '啦'], 嘛: ['吗', '吧', '呢'], 啦: ['吗', '呢', '吧'], 呀: ['吗', '吧'] };
const PITEMS = (DATA.parts || []).map(([w, z, s, blanks, wrong, sit, ex], id) => ({ id, w, z, s, blanks, wrong, sit, ex, ans: z[blanks[0]] }));
const asTurn = ([w, z, s], spk = 'A', en = '') => ({ w, z, s, en, spk, key: z.join('') });
const CONTRASTS = (DATA.contrast || []).map(([label, items, ex], id) => ({ id, label, ex, items: items.map(([w, z, s, m]) => Object.assign(asTurn([w, z, s]), { m })) }));
const ECHO = (DATA.echo || []).map(([q, opts, intent, ex], id) => ({ id, q: asTurn(q, 'A'), ans: asTurn(opts[0], 'B'), wrong: opts.slice(1).map(o => asTurn(o, 'B')), intent, ex }));

/* ---------- chat words: labels + usage notes ---------- */
function kindPill(id) {
  const x = SPOKEN_BY_ID[id]; if (!x) return '';
  const [zh, en] = KIND_LABEL[x.kind];

  return `<span class="pill ${cls}" title="chat word${S.settings.chatBoost ? ': trained at ' + Math.round(CHAT_RETENTION * 100) + '% retention for extra reviews' : ''}">💬 ${zh} · ${en}</span>`;
}
/** usage text: runs of Chinese become clickable audio */
function noteHTML(text) {
  return esc(text).replace(/[一-鿿][一-鿿，。？！、…]*/g, m => `<span class="han say" data-say="${m}" title="play">${m}</span>`);
}
function usageHTML(id, small = false) {
  const x = SPOKEN_BY_ID[id]; if (!x) return '';
  return `<div class="usage ${small ? 'small' : ''} k-${x.kind}"><div class="un">💬 ${noteHTML(x.note)}</div></div>`;

/* ---------- scheduling ---------- */
function ensureDCard(key) { return S.dcards[key] || (S.dcards[key] = { st: 0, s: 0, d: 0, due: 0, last: 0, reps: 0, lapses: 0 }); }
const isDlgSeen = key => { const c = S.dcards[key]; return !!(c && c.st > 0); };
const dlgWordIds = d => [...new Set(d.t.flatMap(x => x.w.filter(w => w >= 0)))];
const dlgEligible = d => dlgWordIds(d).every(id => isSeen(id) && !isSusp(id));
function dlgSeenCount() { return Object.values(S.dcards).filter(c => c.st > 0).length; }
function eligibleDlgCount() { return DLGS.filter(dlgEligible).length; }
function dueDlgKeys(di = today()) {
  return Object.keys(S.dcards).filter(k => { const c = S.dcards[k], d = DLG_BY_KEY[k]; return d && c.st > 0 && !c.susp && c.due <= di && !dlgWordIds(d).some(isSusp); })
    .sort((a, b) => S.dcards[a].due - S.dcards[b].due || FSRS.retrievability(S.dcards[a]) - FSRS.retrievability(S.dcards[b]));
}
/** new dialogues: all words known; dialogues with freshly learned chat words come first */
function newDlgKeys(limit) {
  if (limit <= 0) return [];
  const fresh = id => { const c = S.cards[id]; return c && c.first && Date.now() - c.first < 7 * DAY_MS; };
  return DLGS.filter(d => !isDlgSeen(d.key) && dlgEligible(d) && !(S.dcards[d.key] && S.dcards[d.key].susp))
    .map(d => { const ws = dlgWordIds(d); const chat = ws.filter(id => SPOKEN_BY_ID[id]);
      return [d.t.reduce((a, x) => a + x.z.length, 0) * 0.5 - chat.length * 2 - chat.filter(fresh).length * 4 + Math.random() * 6, d.key]; })
    .sort((a, b) => a[0] - b[0]).slice(0, limit).map(x => x[1]);
}
function newDlgLeftToday() { return Math.max(0, Math.floor((S.settings.newDlgPerDay || 0) * catchUpFactor()) - (dayStats().dNew || 0)); }
function mixDialogues(main, ddue, dnew) {
  const out = main.slice();
  const put = (it, frac) => out.splice(Math.min(out.length, Math.max(1, Math.round(out.length * frac))), 0, it);
  ddue.forEach((it, k) => put(it, (k + 1) / (ddue.length + 1)));
  dnew.forEach((it, k) => put(it, 0.25 + 0.6 * (k + 1) / (dnew.length + 1)));
  return out;
}
function dlgMemLine(key) {
  const c = S.dcards[key];
  if (!c || !c.st) return 'new dialogue';
  return `stability ${fmtIvl(c.s)} · difficulty ${c.d.toFixed(1)} · recall ${(FSRS.retrievability(c) * 100).toFixed(0)}% · reviews ${c.reps}`;
}

/* ---------- rendering ---------- */
const turnTexts = d => d.t.map(x => x.key);
const sayTurnsAttr = d => esc(turnTexts(d).join('｜'));
/** one chat bubble. o: {pinyin, mask:Set of token idx, hidden, en, hl, cls} */
function bubbleHTML(turn, o = {}) {
  const side = turn.spk === 'A' ? 'a' : 'b';
  let inner;
  if (o.hidden) inner = '<div class="btxt dots">…</div>';
  else if (o.pinyin) {

      answered = false;
    }
    function choose(i) {
      if (answered) return; answered = true; total++;
      const ask = asks[k], right = sents[i].key === ask.key;
      solved.add(ask.key);
      $$('.opt', el).forEach((b, j) => { b.disabled = true; if (sents[j].key === ask.key) b.classList.add('right'); else if (j === i) b.classList.add('wrong'); });
      if (right) { correct++; xp += 3; SFX.good(); } else SFX.bad();
      TTS.speak(ask.key);
      const last = k === 3;
      $('#pres').innerHTML = `<div class="reveal" style="text-align:center">${sentenceHTML(ask)}<div class="muted">${esc(ask.m)}</div>
        ${last ? `<div class="ctable">${c.items.map(x => `<div class="crow" data-say="${esc(x.key)}"><span class="han">${esc(x.key)}</span><span>${sentPinyinHTML(x)}</span><span class="muted">${esc(x.m)}</span></div>`).join('')}</div><div class="usage small" style="margin:8px auto 0">${noteHTML(c.ex)}</div>` : ''}
        <div class="row" style="justify-content:center;margin-top:10px">${nextBtn('pnext', last ? (idx + 1 < rounds.length ? 'Next round' : 'Finish') : 'Next')}</div></div>`;
      bindCommon($('#pres'));
      $('#pnext').addEventListener('click', go2);
    }
    function go2() { if (!answered) return; if (k < 3) { k++; draw(); } else next(); }
    draw();
    KEYH = e => {
      if (answered) { if (e.key === 'Enter' || e.key === ' ') { go2(); return true; } if (e.key === 'r' || e.key === 'R') { TTS.speak(asks[k].key); return true; } return false; }
      if (/^[1-4]$/.test(e.key)) { choose(+e.key - 1); return true; }
      return false;
    };
  }
  function next() { idx++; if (idx < rounds.length) play(); else end(); }
  function end() {
    KEYH = null;
    el.innerHTML = `<div class="explain">Same tokens, different particle, different reply: 好啊 (happy yes), 好吧 (reluctant OK), 好的 (will do). A pretrained model knows the words; <b>chat fine-tuning</b> teaches it which continuation fits the conversation, including the tone. Your dialogue cards train exactly that.</div>`;
    done({ xp: Math.max(4, xp), score: Math.round(100 * correct / Math.max(1, total)), summary: `${correct}/${total} right` });
  }
  play();
}

/* ---------- mini-game: Echo (yes/no by copying the verb) ---------- */
function echoPool() { return ECHO.filter(x => unknownIn(x.q.w) === 0 && unknownIn([...new Set([x.ans, ...x.wrong].flatMap(t => t.w))]) <= 1); }
GAMES.echo = {
  title: 'Echo', zh: '回答', note: null, learn: 'induction', logit: 0.5,
  desc: 'Chinese has no all-purpose "yes": answer by repeating the verb (喜欢！ 去！ 有啊！), and pick 不 or 没 for "no".',
  available: () => echoPool().length >= 4,
  start: gameEcho,
};
function gameEcho(el, done) {
  const pool = shuffle(echoPool());
  const items = [], seenQ = new Set();
  for (const x of pool) { if (items.length >= 6) break; if (seenQ.has(x.q.key)) continue; items.push(x); seenQ.add(x.q.key); }
  for (const x of pool) { if (items.length >= 6) break; if (!items.includes(x)) items.push(x); }
  let idx = 0, xp = 0, correct = 0;
  function play() {
    const x = items[idx];
    const opts = shuffle([x.ans, ...x.wrong]);
    let answered = false;
    el.innerHTML = `<div class="explain">Question ${idx + 1}/${items.length}. Chinese has no all-purpose "yes" or "no": you <b>copy the verb</b> from the question, the way a transformer's induction heads copy tokens from the prompt. <kbd>1</kbd>–<kbd>${opts.length}</kbd> pick.</div>
      <div style="text-align:center"><span class="pill gold" style="font-size:14px">${esc(x.intent)}</span></div>
      <div class="chat" data-turns="${esc(x.q.key)}">${bubbleHTML(x.q)}${bubbleHTML(x.ans, { hidden: true })}</div>
      <div class="opts one">${opts.map((o, i) => `<button class="opt" data-i="${i}"><span class="k">${i + 1}</span><span class="optzh"><span class="han">${esc(o.key)}</span></span></button>`).join('')}</div>
      <div id="eres"></div>`;
    bindCommon(el);
    setTimeout(() => TTS.speak(x.q.key), 200);
    const choose = i => {
      if (answered) return; answered = true;
      const right = opts[i] === x.ans;
      $$('.opt', el).forEach((b, j) => { b.disabled = true; b.classList.add(opts[j] === x.ans ? 'right' : j === i ? 'wrong' : 'dim'); });
      if (right) { correct++; xp += 5; SFX.good(); } else SFX.bad();
      $('#eres').innerHTML = `<div class="reveal"><div class="exbox chatex" data-turns="${esc(x.q.key + '｜' + x.ans.key)}">${'<div class="chat small">' + bubbleHTML(x.q, { pinyin: true }) + bubbleHTML(x.ans, { pinyin: true }) + '</div>'}</div>
        <div class="usage small">${right ? '' : `<b>${esc(opts[i].key)}</b> doesn't fit here. `}${noteHTML(x.ex)}</div>
        <div class="row" style="justify-content:center;margin-top:10px"><button class="btn primary" id="enext">${idx + 1 < items.length ? 'Next' : 'Finish'} <kbd style="color:inherit;background:transparent;border-color:rgba(255,255,255,.4)">Enter</kbd></button></div></div>`;
      bindCommon($('#eres'));
      TTS.speakTurns([x.q.key, x.ans.key]);
      $('#enext').addEventListener('click', next);
    };
    $$('.opt', el).forEach(b => b.addEventListener('click', () => choose(+b.dataset.i)));
    KEYH = e => {
      if (answered) { if (e.key === 'Enter' || e.key === ' ') { next(); return true; } return false; }
      if (e.key === 'r' || e.key === 'R') { TTS.speak(x.q.key); return true; }
      if (/^[1-4]$/.test(e.key) && +e.key <= opts.length) { choose(+e.key - 1); return true; }
      return false;
    };
  }
  function next() { idx++; if (idx < items.length) play(); else end(); }
  function end() {
    KEYH = null;
    el.innerHTML = `<div class="explain">你喜欢吗？ → 喜欢！ · 你有吗？ → 没有。 · 你吃了吗？ → 还没。 Answers reuse the verb from the question, and the "no" depends on it: 不 for wants, habits and the future, 没 for 有 and for things that didn't happen. Copying from context is also one of the first tricks a transformer learns (see the note on <b>induction heads</b>).</div>`;
    done({ xp: Math.max(4, xp), score: Math.round(100 * correct / items.length), summary: `${correct}/${items.length} natural answers` });
  }
  play();
}

      <div class="card stat"><span class="v">${seen.length}</span><span class="k">vocab</span><span class="s">${young} young · ${mature} mature · ${sentSeenCount()} sentences · ${dlgSeenCount()} chats · ${idiomSeenCount()} 成语</span></div>
      <div class="card stat"><span class="v">${(avgR * 100).toFixed(0)}%</span><span class="k">avg recall now</span><span class="s">FSRS estimate, target ${(S.settings.retention * 100).toFixed(0)}%</span></div>
      <div class="card stat"><span class="v">${S.epochs.length}</span><span class="k">epochs</span><span class="s">${Math.round(totalMs / 60000)} min total</span></div>
      <div class="card stat"><span class="v">${streak()}</span><span class="k">day streak</span><span class="s">${S.xp} XP total</span></div>
    </div>
    <div class="card" style="margin-bottom:16px"><h3>Training loss per epoch</h3>${S.epochs.length > 1 ? lossChart(S.epochs.slice(-60)) : '<p class="muted">Train a couple of epochs to see your loss curve.</p>'}
      <p class="faint" style="font-size:12px;margin:6px 0 0">Loss = −mean log p(correct), with p ≈ 0.15 / 0.55 / 0.85 / 0.95 for Again / Hard / Good / Easy. Lower is better; it rises a bit when old words come back for review, just like validation loss on harder data.</p></div>
    <div class="grid g2">
      <div class="card"><h3>Reviews, last 30 days</h3>${barChart(last30.map(d => S.days[d] ? S.days[d].rev + S.days[d].new : 0), last30.map(d => dayLabel(d).slice(5)))}</div>
      <div class="card"><h3>Due forecast, next 14 days</h3>${barChart(forecast, fc.map((d, i) => i === 0 ? 'today' : '+' + i), 'var(--gold)')}</div>
    </div>
    <div class="card" style="margin-top:16px"><h3>Activity</h3><div class="heatcal">${cal.map(d => { const v = S.days[d] ? S.days[d].rev + S.days[d].new : 0; return `<i title="${dayLabel(d)}: ${v}" style="${v ? `background:color-mix(in srgb, var(--jade) ${Math.round(25 + 75 * v / maxDay)}%, var(--card2))` : ''}${d > t ? ';opacity:.25' : ''}"></i>`; }).join('')}</div></div>
    <div class="card" style="margin-top:16px"><h3>Memory map · stability per word</h3><div style="display:flex;flex-wrap:wrap;gap:3px">${(() => { const pre = CORE_ORDER.slice(0, Math.max(150, seen.length + 30)); const ps = new Set(pre); return pre.concat(CORE_ORDER.filter(id => !ps.has(id) && isSeen(id))); })().map(id => { const c = S.cards[id]; const s = c && c.st ? c.s : 0;
      const col = !s ? 'var(--card2)' : s < 3 ? 'var(--t1)' : s < 7 ? 'var(--t2)' : s < 21 ? 'var(--t3)' : 'var(--t4)';
      return `<span data-word="${id}" title="${esc(WORDS[id].h)} · ${s ? 'S ' + fmtIvl(s) : 'new'}" style="width:14px;height:14px;border-radius:3px;background:${col};cursor:pointer;${c && c.susp ? 'opacity:.3' : ''}"></span>`; }).join('')}</div>
      <p class="faint" style="font-size:12px;margin:8px 0 0">red &lt;3d · orange &lt;7d · green &lt;21d · blue mature · grey new, in learning order</p></div>`;
  bindCommon(m);
}

/* ---------- settings ---------- */
function segCtl(key, opts) { return `<div class="seg-ctl" data-set="${key}">${opts.map(([v, l]) => `<button data-v="${v}" class="${String(S.settings[key]) === String(v) ? 'on' : ''}">${l}</button>`).join('')}</div>`; }
function renderSettings(m) {
  const st = S.settings;
  const voices = TTS.list();
  m.innerHTML = `<h2>Settings · 设置 <span class="muted" style="font-weight:400;font-size:15px">shèzhì</span></h2>
    <div class="card" style="margin-top:14px"><h3>Training hyperparameters · 超参数</h3><div class="set">
      <label>New words per day<span class="d">Anki default is 20; 10 keeps epochs near 10 minutes.</span></label>
      <div class="row"><input type="range" min="0" max="30" step="1" value="${st.newPerDay}" data-num="newPerDay" style="flex:1"><b class="mono" id="v-newPerDay">${st.newPerDay}</b></div>
      <label>New sentences per day<span class="d">Sentence cards only use words you already know. 0 turns them off.</span></label>
      <div class="row"><input type="range" min="0" max="15" step="1" value="${st.newSentPerDay}" data-num="newSentPerDay" style="flex:1"><b class="mono" id="v-newSentPerDay">${st.newSentPerDay}</b></div>
      <label>New idioms<span class="d">成语 cards are a rare side dish: they start once you know ${IDIOM_MIN_VOCAB} words, and at most 3 idiom reviews come up per epoch.</span></label>${segCtl('idiomEvery', [[0, 'Off'], [7, 'Weekly'], [3, 'Every 3 days'], [1, 'Daily']])}
      <label>New dialogues per day<span class="d">Chat cards: short two-person exchanges made only of words you know. 0 turns them off.</span></label>
      <div class="row"><input type="range" min="0" max="10" step="1" value="${st.newDlgPerDay}" data-num="newDlgPerDay" style="flex:1"><b class="mono" id="v-newDlgPerDay">${st.newDlgPerDay}</b></div>
      <label>Chat words per epoch<span class="d">Spoken reactions, mood particles, fillers and key function words (对对对, 好的, 吧, 啊, 也, 就…), mixed into your new words.</span></label>
      <div class="row"><input type="range" min="0" max="6" step="1" value="${st.chatPerEpoch}" data-num="chatPerEpoch" style="flex:1"><b class="mono" id="v-chatPerEpoch">${st.chatPerEpoch}</b></div>
      <label>Extra reviews for chat words<span class="d">Schedules chat words for ${Math.round(CHAT_RETENTION * 100)}% retention instead of your desired retention: about twice as many reviews.</span></label>${segCtl('chatBoost', [[true, 'On'], [false, 'Off']])}
      <label>Sentence building<span class="d">Tiles, or type with the Chinese keyboard (Windows: add "Chinese (Simplified) - Microsoft Pinyin" under Language) or plain pinyin.</span></label>${segCtl('sentInput', [['tiles', '🧩 Word tiles'], ['type', '⌨ Typing']])}
      <label>Catch-up mode<span class="d">After a break, new words are throttled until the review pile shrinks, epochs review at most ~${reviewCap()} words (most-forgotten first), and new words enter one at a time.</span></label>${segCtl('catchUp', [[true, 'On'], [false, 'Off']])}
      <label>Desired retention<span class="d">FSRS schedules each review when recall is predicted to drop to this. Higher = more reviews.</span></label>
      <div class="row"><input type="range" min="0.8" max="0.97" step="0.01" value="${st.retention}" data-num="retention" style="flex:1"><b class="mono" id="v-retention">${Math.round(st.retention * 100)}%</b></div>
      <label>Epoch goal (minutes)</label>
      <div class="row"><input type="range" min="5" max="30" step="1" value="${st.targetMin}" data-num="targetMin" style="flex:1"><b class="mono" id="v-targetMin">${st.targetMin}</b></div>
      <label>Temperature<span class="d">Softmax temperature of the epoch planner. Low = mostly cards, high = more mini-games.</span></label>
      <div><div class="row"><input type="range" min="0.1" max="2.5" step="0.05" value="${st.temperature}" data-num="temperature" style="flex:1"><b class="mono" id="v-temperature">${st.temperature.toFixed(2)}</b></div><div class="tbars" id="tbars"></div></div>
      <label>Card style</label>${segCtl('cardStyle', [['game', 'Game (mixed modes)'], ['classic', 'Classic flip (Anki)']])}
      <label>AI-term cards<span class="d">Adds the Chinese word for each unlocked LLM concept (量化, 注意力…).</span></label>${segCtl('aiTerms', [[true, 'On'], [false, 'Off']])}
      <label>Pinyin hint on reading cards</label>${segCtl('pinyinHint', [[false, 'Off'], [true, 'On']])}
    </div></div>
    <div class="card" style="margin-top:16px"><h3>Audio · 声音</h3><div class="set">
      <label>Chinese voice<span class="d">${voices.length ? voices.length + ' Chinese voice(s) found' : 'None found. Windows: Settings → Time &amp; language → Speech → Add voices → Chinese (Simplified). Edge has natural online voices.'}</span></label>
      <div class="row"><select id="voice" style="flex:1">${voices.map(v => `<option value="${esc(v.voiceURI)}" ${v.voiceURI === st.voice ? 'selected' : ''}>${esc(v.name)} (${esc(v.lang)})</option>`).join('') || '<option>no Chinese voice</option>'}</select>${speakBtn('你好，我在学习汉语。')}</div>
      <label>Speech rate</label>
      <div class="row"><input type="range" min="0.5" max="1.2" step="0.05" value="${st.rate}" data-num="rate" style="flex:1"><b class="mono" id="v-rate">${st.rate.toFixed(2)}</b></div>
      <label>Autoplay word audio</label>${segCtl('autoplay', [[true, 'On'], [false, 'Off']])}
      <label>Sound effects</label>${segCtl('sfx', [[true, 'On'], [false, 'Off']])}
    </div></div>
    <div class="card" style="margin-top:16px"><h3>Look · 外观</h3><div class="set">
      <label>Theme</label>${segCtl('theme', [['dark', 'Dark'], ['light', 'Paper'], ['auto', 'System']])}
      <label>Character font<span class="d">楷体 looks handwritten, 黑体 is what you see on screens. Learn both.</span></label>${segCtl('font', [['kai', '楷体 Kai'], ['sans', '黑体 Sans'], ['serif', '宋体 Song']])}
    </div></div>
    <div class="card" style="margin-top:16px"><h3>Data · 数据</h3>
      <p class="muted" style="margin-top:0">Progress is stored in this browser (localStorage) for this file. Export a backup now and then, especially before clearing browser data or moving the file.</p>
      <div class="row"><button class="btn" id="exp">Export backup</button><label class="btn" style="cursor:pointer">Import backup<input type="file" id="imp" accept=".json,application/json" hidden></label><span class="spacer"></span><button class="btn" id="reset" style="color:var(--bad)">Reset everything…</button></div>
    </div>
    <p class="faint" style="font-size:12px;margin-top:20px">Vocabulary: ~1100 core words (HSK 2.0 levels 1–4) in a frequency-informed learning order, plus AI terms. Scheduling: FSRS-5 with default parameters. Audio: your system's speech voices.</p>`;
  $$('[data-num]', m).forEach(inp => inp.addEventListener('input', () => {
    const k = inp.dataset.num, v = +inp.value; st[k] = v;
    const lab = $('#v-' + k);
    if (lab) lab.textContent = k === 'retention' ? Math.round(v * 100) + '%' : (k === 'temperature' || k === 'rate') ? v.toFixed(2) : v;
    if (k === 'temperature') tempBars();
    save();
  }));
  $$('[data-set]', m).forEach(ctl => $$('button', ctl).forEach(b => b.addEventListener('click', () => {
    const k = ctl.dataset.set; let v = b.dataset.v; if (v === 'true') v = true; else if (v === 'false') v = false; else if (/^\d+$/.test(v)) v = +v;
    st[k] = v; save(); applyTheme();
    $$('button', ctl).forEach(x => x.classList.toggle('on', x === b));
  })));
  const vs = $('#voice'); vs.addEventListener('change', () => { st.voice = vs.value; save(); TTS.speak('你好'); });
  bindCommon(m);
  $('#exp').addEventListener('click', exportSave);
  $('#imp').addEventListener('change', e => importSave(e.target.files[0]));
  $('#reset').addEventListener('click', () => {
    const mm = modal(`<h2>Reset everything?</h2><p>This deletes all progress in this browser: cards, XP, epochs. Export a backup first if unsure.</p>
      <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="doreset">Delete all progress</button></div>`, null, { noEnter: true });
    $('#doreset', mm.bg).addEventListener('click', () => { S = freshState(); S.welcomed = true; save(); mm.close(); applyTheme(); go('home'); toast('Weights re-initialized.'); });
  });
  tempBars();
}
function tempBars() {
  const el = $('#tbars'); if (!el) return;
  const opts = [['cards', 1.5], ...Object.entries(GAMES).map(([k, g]) => [k, g.logit])];
  const p = softmax(opts.map(o => o[1]), S.settings.temperature);
  el.innerHTML = opts.map(([k], i) => `<div class="r"><span>${k === 'cards' ? 'keep studying' : esc(GAMES[k].title)}</span><span class="b"><i style="width:${(p[i] * 100).toFixed(1)}%"></i></span><span class="mono">${(p[i] * 100).toFixed(0)}%</span></div>`).join('')
    + '<div class="faint" style="font-size:11px">p<sub>i</sub> = softmax(z<sub>i</sub> / T), checked every few cards (locked games are skipped)</div>';
}
function exportTSV() {
  const list = dictList();
  const rows = list.map(w => { const ex = exampleFor(w.id);
    return [w.h, w.p, w.m, w.l === SPOKEN_LV ? 'spoken' : w.l ? 'HSK' + w.l + (SPOKEN_BY_ID[w.id] ? ' chat' : '') : 'AI', ex ? sentText(ex) : '', ex ? ex.en : ''].map(x => String(x).replace(/[\t\n]/g, ' ')).join('\t'); });
  const head = '#separator:tab\n#html:false\n#columns:Hanzi\tPinyin\tMeaning\tTags\tExample\tExample (English)\n#tags column:4\n';
  const blob = new Blob([head + rows.join('\n')], { type: 'text/tab-separated-values' });
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = `xiaomoxing-words-${list.length}.txt`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast(`Exported ${list.length} words. In Anki: File → Import.`);
}
function exportSave() {
  S.lastBackup = Date.now(); save();
  const blob = new Blob([JSON.stringify(S)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = `xiaomoxing-backup-${dayLabel(today())}.json`;
  document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
  toast('Backup downloaded');
}
function importSave(file) {
  if (!file) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const st = JSON.parse(r.result);
      if (!st || typeof st.cards !== 'object' || !st.settings) throw new Error('not a backup');
      const mm = modal(`<h2>Import backup?</h2><p>This replaces current progress with the backup (${Object.keys(st.cards).length} cards, ${st.xp || 0} XP).</p>
        <div class="row" style="margin-top:16px"><span class="spacer"></span><button class="btn" data-close>Cancel</button><button class="btn primary" id="doimp">Import</button></div>`, null, { noEnter: true });
      $('#doimp', mm.bg).addEventListener('click', () => { localStorage.setItem(SAVE_KEY, JSON.stringify(st)); S = loadState(); save(); mm.close(); applyTheme(); go('home'); toast('Backup restored'); });
    } catch (e) { toast('That file is not a 小模型 backup.', 'warn'); }
  };
  r.readAsText(file);
}

/* ---------- init ---------- */
function init() {
  applyTheme();
  matchMedia('(prefers-color-scheme: light)').addEventListener('change', applyTheme);
  $$('.nav button').forEach(b => b.addEventListener('click', () => go(b.dataset.go)));
  $('.logo').addEventListener('click', () => go('home'));
  document.addEventListener('voices', () => { if (VIEW === 'settings') renderSettings($('#main')); });
  go('home');
}
document.addEventListener('DOMContentLoaded', init);

</script>
</body>
</html>
